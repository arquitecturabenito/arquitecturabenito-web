<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 2093" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="50%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#ece5d8"/>
    </linearGradient>
    <linearGradient id="warmAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d6a8"/>
      <stop offset="50%" stop-color="#d99955"/>
      <stop offset="100%" stop-color="#8a4f1d"/>
    </linearGradient>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c8963e" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1480" height="2093" fill="url(#paperGrad)"/>
  <rect width="1480" height="2093" fill="url(#dotGrid)"/>

  <!-- Left spine depth for booklet aesthetic -->
  <rect x="0" y="0" width="28" height="2093" fill="#8a5318" fill-opacity="0.25"/>
  <line x1="28" y1="0" x2="28" y2="2093" stroke="#b87d2b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Editorial layout frame -->
  <rect x="80" y="80" width="1320" height="1933" fill="none" stroke="#b87d2b" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="92" y="92" width="1296" height="1909" fill="none" stroke="#b87d2b" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Registration marks -->
  <g stroke="#b87d2b" stroke-width="1" stroke-opacity="0.5">
    <line x1="60" y1="80" x2="100" y2="80"/><line x1="80" y1="60" x2="80" y2="100"/>
    <line x1="1380" y1="80" x2="1420" y2="80"/><line x1="1400" y1="60" x2="1400" y2="100"/>
    <line x1="60" y1="2013" x2="100" y2="2013"/><line x1="80" y1="1993" x2="80" y2="2033"/>
    <line x1="1380" y1="2013" x2="1420" y2="2013"/><line x1="1400" y1="1993" x2="1400" y2="2033"/>
  </g>

  <!-- Top Metadata -->
  <text x="140" y="150" font-family="'Space Mono', monospace" font-size="22" letter-spacing="4" fill="#8a5318" opacity="0.8">BENITO GONZÁLEZ QUIÑONES</text>
  <text x="1340" y="150" text-anchor="end" font-family="'Space Mono', monospace" font-size="20" letter-spacing="3" fill="#8a5318" opacity="0.65">LIBRETO 07 · AbrAzoS</text>
  <line x1="140" y1="175" x2="1340" y2="175" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Graphic Art Panel: AbrAzoS / Gestos urbanos y encuentros humanos -->
  <g transform="translate(140, 240)">
    <rect width="1200" height="1200" fill="#f8f4ec" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Warm amber wash background -->
    <rect x="20" y="20" width="1160" height="1160" fill="#fcf6ec"/>
    <circle cx="600" cy="500" r="320" fill="url(#warmAmberGrad)" fill-opacity="0.25"/>

    <!-- Two embracing human silhouettes in architectural space -->
    <!-- Shadow cast across pavement -->
    <ellipse cx="600" cy="1060" rx="420" ry="60" fill="#8a5318" fill-opacity="0.2"/>

    <!-- Left figure -->
    <path d="M 440,540 C 420,440 480,360 520,360 C 560,360 580,420 570,480 C 550,560 510,640 490,720 C 470,820 460,940 450,1050 L 520,1050 C 530,940 550,840 570,760 C 600,640 610,540 600,480" fill="#4d2c14" fill-opacity="0.85"/>
    <circle cx="530" cy="320" r="50" fill="#4d2c14"/>

    <!-- Right figure interlocked in embrace -->
    <path d="M 720,540 C 740,440 680,360 640,360 C 600,360 590,420 610,480 C 630,560 670,640 690,720 C 710,820 720,940 730,1050 L 660,1050 C 650,940 630,840 610,760 C 580,640 570,540 580,480" fill="#8c471c" fill-opacity="0.8"/>
    <circle cx="650" cy="310" r="48" fill="#8c471c"/>

    <!-- Arms crossing around shoulders -->
    <path d="M 520,440 Q 640,400 700,490 Q 720,530 680,560" fill="none" stroke="#4d2c14" stroke-width="32" stroke-linecap="round"/>
    <path d="M 660,450 Q 550,420 480,510 Q 460,540 490,580" fill="none" stroke="#8c471c" stroke-width="28" stroke-linecap="round"/>

    <!-- Architectural context: Urban square arcade arches in background -->
    <path d="M 80,1050 L 80,450 Q 200,350 320,450 L 320,1050" fill="none" stroke="#b87d2b" stroke-width="2" stroke-opacity="0.3"/>
    <path d="M 880,1050 L 880,450 Q 1000,350 1120,450 L 1120,1050" fill="none" stroke="#b87d2b" stroke-width="2" stroke-opacity="0.3"/>

    <!-- Ground paving stones grid -->
    <line x1="20" y1="1050" x2="1180" y2="1050" stroke="#b87d2b" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="20" y1="1110" x2="1180" y2="1110" stroke="#b87d2b" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Inner frame crop marks -->
    <text x="50" y="70" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#8a5318" opacity="0.7">EXP. 35MM · KODAK PORTRA 400 · LA CALLE Y EL GESTO</text>
    <text x="1130" y="70" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" fill="#8a5318" opacity="0.7">PLACA #07</text>
  </g>

  <!-- Typography Block -->
  <g transform="translate(140, 1530)">
    <text x="0" y="60" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" letter-spacing="4" fill="#2d1c08">AbrAzoS</text>
    <text x="0" y="125" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="34" fill="#8a5318">Cuerpos, afecto cotidiano y la escala humana en el espacio común</text>

    <line x1="0" y1="160" x2="1200" y2="160" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Details Grid -->
    <text x="0" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#8a5318" opacity="0.8">LUGAR</text>
    <text x="0" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">CALLES Y PLAZAS</text>

    <text x="380" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#8a5318" opacity="0.8">PERIODO</text>
    <text x="380" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">2023 – 2024</text>

    <text x="760" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#8a5318" opacity="0.8">FORMATO</text>
    <text x="760" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">LIBRETO A5 · PDF CERRADO</text>

    <!-- Barcode -->
    <g transform="translate(1040, 200)">
      <rect x="0" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="10" y="0" width="8" height="60" fill="#8a5318"/>
      <rect x="25" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="35" y="0" width="12" height="60" fill="#8a5318"/>
      <rect x="55" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="68" y="0" width="16" height="60" fill="#8a5318"/>
      <rect x="92" y="0" width="6" height="60" fill="#8a5318"/>
      <rect x="106" y="0" width="10" height="60" fill="#8a5318"/>
      <rect x="124" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="135" y="0" width="14" height="60" fill="#8a5318"/>
      <text x="75" y="80" text-anchor="middle" font-family="'Space Mono', monospace" font-size="14" fill="#8a5318">A5-ABRAZOS-2024</text>
    </g>
  </g>

  <!-- Bottom Page Marker -->
  <line x1="140" y1="1970" x2="1340" y2="1970" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="2010" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#8a5318" opacity="0.7">ARCHIVO DOCUMENTAL · FOTOGRAFÍA</text>
  <text x="1340" y="2010" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#8a5318" opacity="0.7">148 × 210 MM</text>
</svg>
