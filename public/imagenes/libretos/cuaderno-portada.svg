<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 2093" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGradCuad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f6f0e4"/>
      <stop offset="100%" stop-color="#ece2d0"/>
    </linearGradient>
    <pattern id="dotGridCuad" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ba8028" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1480" height="2093" fill="url(#paperGradCuad)"/>
  <rect width="1480" height="2093" fill="url(#dotGridCuad)"/>

  <!-- Spine Depth -->
  <rect x="0" y="0" width="28" height="2093" fill="#7a460e" fill-opacity="0.25"/>
  <line x1="28" y1="0" x2="28" y2="2093" stroke="#aa6f1a" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Editorial Layout Frame -->
  <rect x="80" y="80" width="1320" height="1933" fill="none" stroke="#aa6f1a" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="92" y="92" width="1296" height="1909" fill="none" stroke="#aa6f1a" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Registration Marks -->
  <g stroke="#aa6f1a" stroke-width="1" stroke-opacity="0.5">
    <line x1="60" y1="80" x2="100" y2="80"/><line x1="80" y1="60" x2="80" y2="100"/>
    <line x1="1380" y1="80" x2="1420" y2="80"/><line x1="1400" y1="60" x2="1400" y2="100"/>
    <line x1="60" y1="2013" x2="100" y2="2013"/><line x1="80" y1="1993" x2="80" y2="2033"/>
    <line x1="1380" y1="2013" x2="1420" y2="2013"/><line x1="1400" y1="1993" x2="1400" y2="2033"/>
  </g>

  <!-- Top Metadata -->
  <text x="140" y="150" font-family="'Space Mono', monospace" font-size="22" letter-spacing="4" fill="#7a460e" opacity="0.8">BENITO GONZÁLEZ QUIÑONES</text>
  <text x="1340" y="150" text-anchor="end" font-family="'Space Mono', monospace" font-size="20" letter-spacing="3" fill="#7a460e" opacity="0.65">LIBRETO 04 · ISO A5</text>
  <line x1="140" y1="175" x2="1340" y2="175" stroke="#aa6f1a" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Photography Panel: Architectural Light, Shadow and Raw Plaster -->
  <g transform="translate(140, 240)">
    <rect width="1200" height="1200" fill="#fbf9f4" stroke="#aa6f1a" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="20" y="20" width="1160" height="1160" fill="#f4ece0"/>

    <!-- Sharp diagonal shadow across raw concrete wall -->
    <polygon points="20,20 1180,20 1180,720 20,1180" fill="#ecdcc7"/>
    <polygon points="340,20 1180,20 1180,480" fill="#deb87b" fill-opacity="0.45"/>
    <polygon points="20,580 840,20 1180,20 1180,1180 20,1180" fill="#7a460e" fill-opacity="0.18"/>

    <!-- Isometric stepped architectural block -->
    <g transform="translate(350, 420)">
      <!-- Top plane -->
      <polygon points="250,50 480,160 250,270 20,160" fill="#fdfbf7"/>
      <!-- Left shaded face -->
      <polygon points="20,160 250,270 250,550 20,440" fill="#c48a33"/>
      <!-- Right deep shadow face -->
      <polygon points="250,270 480,160 480,440 250,550" fill="#663908"/>
      <!-- Grazing shadow cast on floor -->
      <polygon points="20,440 250,550 480,440 580,500 480,680 180,620" fill="#4d2b06" fill-opacity="0.35"/>
    </g>

    <!-- Technical architectural measurement lines in ochre -->
    <g stroke="#aa6f1a" stroke-width="1.5" stroke-opacity="0.7">
      <line x1="180" y1="180" x2="380" y2="180"/>
      <line x1="180" y1="170" x2="180" y2="190"/>
      <line x1="380" y1="170" x2="380" y2="190"/>
      <text x="280" y="165" text-anchor="middle" font-family="'Space Mono', monospace" font-size="14" fill="#7a460e">d = 450 MM</text>

      <!-- Ray angle vector -->
      <line x1="900" y1="200" x2="1080" y2="380" stroke-dasharray="6,4"/>
      <circle cx="1080" cy="380" r="4" fill="#aa6f1a"/>
      <text x="1000" y="270" font-family="'Space Mono', monospace" font-size="14" fill="#7a460e">θ = 38.5°</text>
    </g>

    <!-- Frame lines and text -->
    <rect x="20" y="20" width="1160" height="1160" fill="none" stroke="#7a460e" stroke-width="2" stroke-opacity="0.4"/>
    <text x="50" y="70" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#7a460e" opacity="0.7">ESTUDIO DE LUZ RASANTE Y SOMBRA</text>
    <text x="1130" y="70" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" fill="#7a460e" opacity="0.7">PLACA #04</text>
  </g>

  <!-- Typography Block -->
  <g transform="translate(140, 1530)">
    <text x="0" y="60" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" letter-spacing="4" fill="#2d1c08">CUADERNO DE CAMPO</text>
    <text x="0" y="125" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="34" fill="#7a460e">Geometrías, ensambles tectónicos y notas de viaje</text>

    <line x1="0" y1="160" x2="1200" y2="160" stroke="#aa6f1a" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Details Grid -->
    <text x="0" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#7a460e" opacity="0.8">TEMA</text>
    <text x="0" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">INVESTIGACIÓN VISUAL</text>

    <text x="380" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#7a460e" opacity="0.8">AÑO</text>
    <text x="380" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">2024</text>

    <text x="760" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#7a460e" opacity="0.8">MEDIO</text>
    <text x="760" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">FOTOGRAMAS Y BOCETOS</text>

    <g transform="translate(1040, 200)">
      <rect x="0" y="0" width="10" height="60" fill="#7a460e"/>
      <rect x="16" y="0" width="4" height="60" fill="#7a460e"/>
      <rect x="28" y="0" width="8" height="60" fill="#7a460e"/>
      <rect x="44" y="0" width="12" height="60" fill="#7a460e"/>
      <rect x="64" y="0" width="4" height="60" fill="#7a460e"/>
      <rect x="76" y="0" width="10" height="60" fill="#7a460e"/>
      <rect x="94" y="0" width="16" height="60" fill="#7a460e"/>
      <rect x="118" y="0" width="4" height="60" fill="#7a460e"/>
      <rect x="128" y="0" width="10" height="60" fill="#7a460e"/>
      <text x="75" y="80" text-anchor="middle" font-family="'Space Mono', monospace" font-size="14" fill="#7a460e">A5-CAMPO-24</text>
    </g>
  </g>

  <line x1="140" y1="1970" x2="1340" y2="1970" stroke="#aa6f1a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="2010" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#7a460e" opacity="0.7">NOTAS GRÁFICAS DE ARQUITECTURA</text>
  <text x="1340" y="2010" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#7a460e" opacity="0.7">148 × 210 MM</text>
</svg>
