<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 2093" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGradRapa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="50%" stop-color="#f2ebe0"/>
      <stop offset="100%" stop-color="#e8ded0"/>
    </linearGradient>
    <pattern id="dotGridRapa" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#a8752c" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1480" height="2093" fill="url(#paperGradRapa)"/>
  <rect width="1480" height="2093" fill="url(#dotGridRapa)"/>

  <!-- Spine Depth -->
  <rect x="0" y="0" width="28" height="2093" fill="#6d4614" fill-opacity="0.25"/>
  <line x1="28" y1="0" x2="28" y2="2093" stroke="#9e6620" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Editorial Layout Frame -->
  <rect x="80" y="80" width="1320" height="1933" fill="none" stroke="#9e6620" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="92" y="92" width="1296" height="1909" fill="none" stroke="#9e6620" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Registration Marks -->
  <g stroke="#9e6620" stroke-width="1" stroke-opacity="0.5">
    <line x1="60" y1="80" x2="100" y2="80"/><line x1="80" y1="60" x2="80" y2="100"/>
    <line x1="1380" y1="80" x2="1420" y2="80"/><line x1="1400" y1="60" x2="1400" y2="100"/>
    <line x1="60" y1="2013" x2="100" y2="2013"/><line x1="80" y1="1993" x2="80" y2="2033"/>
    <line x1="1380" y1="2013" x2="1420" y2="2013"/><line x1="1400" y1="1993" x2="1400" y2="2033"/>
  </g>

  <!-- Top Metadata -->
  <text x="140" y="150" font-family="'Space Mono', monospace" font-size="22" letter-spacing="4" fill="#6d4614" opacity="0.8">BENITO GONZÁLEZ QUIÑONES</text>
  <text x="1340" y="150" text-anchor="end" font-family="'Space Mono', monospace" font-size="20" letter-spacing="3" fill="#6d4614" opacity="0.65">LIBRETO 02 · ISO A5</text>
  <line x1="140" y1="175" x2="1340" y2="175" stroke="#9e6620" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Photo Art Panel: Sabucedo Curro & Horses -->
  <g transform="translate(140, 240)">
    <rect width="1200" height="1200" fill="#f8f4eb" stroke="#9e6620" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="20" y="20" width="1160" height="1160" fill="#eae1d2"/>

    <!-- Mist and mountain contour in ochre wash -->
    <path d="M 20,400 Q 350,220 700,320 T 1180,260 L 1180,1180 L 20,1180 Z" fill="#bfae95" fill-opacity="0.3"/>
    <path d="M 20,550 Q 400,420 800,520 T 1180,480 L 1180,1180 L 20,1180 Z" fill="#9e6620" fill-opacity="0.2"/>

    <!-- Stone Curro Circular Wall -->
    <ellipse cx="600" cy="850" rx="520" ry="260" fill="none" stroke="#5a3810" stroke-width="14" stroke-dasharray="24,8"/>
    <ellipse cx="600" cy="860" rx="510" ry="250" fill="#8c5818" fill-opacity="0.25"/>

    <!-- Dynamic wild horse silhouettes in raw ochre and charcoal -->
    <!-- Horse 1 -->
    <path d="M 320,820 C 340,750 380,720 440,730 C 470,690 510,680 540,710 C 560,700 580,720 570,750 C 550,770 530,790 520,830 C 500,880 470,920 450,960 L 410,950 L 430,890 L 370,890 L 350,960 L 310,950 Z" fill="#3a250e"/>
    <!-- Mane flowing in wind -->
    <path d="M 440,710 Q 380,680 340,720" stroke="#b87d2b" stroke-width="6" fill="none"/>
    <path d="M 460,700 Q 410,660 370,700" stroke="#b87d2b" stroke-width="5" fill="none"/>

    <!-- Horse 2 rearing / turning -->
    <path d="M 640,780 C 660,700 710,670 780,680 C 820,630 870,640 890,680 C 910,680 930,710 910,740 C 880,760 860,780 840,840 C 820,890 800,940 780,980 L 740,970 L 760,890 L 700,900 L 680,980 L 640,970 Z" fill="#5c3810"/>
    <path d="M 760,670 Q 710,620 660,660" stroke="#d49b42" stroke-width="6" fill="none"/>

    <!-- Aloitador tension silhouette -->
    <path d="M 520,790 C 540,760 560,750 580,770 L 590,820 L 630,830 L 620,880 L 580,870 L 570,940 L 540,940 L 550,860 L 510,840 Z" fill="#8c5818"/>

    <!-- Ochre dust cloud / ritual energy -->
    <ellipse cx="600" cy="920" rx="350" ry="100" fill="#d49b42" fill-opacity="0.25"/>
    <ellipse cx="600" cy="910" rx="260" ry="60" fill="#b87d2b" fill-opacity="0.3"/>

    <!-- Frame lines and text -->
    <rect x="20" y="20" width="1160" height="1160" fill="none" stroke="#6d4614" stroke-width="2" stroke-opacity="0.4"/>
    <text x="50" y="70" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#6d4614" opacity="0.7">SABUCEDO · PONTEVEDRA · 2025</text>
    <text x="1130" y="70" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" fill="#6d4614" opacity="0.7">PLACA #02</text>
  </g>

  <!-- Typography Block -->
  <g transform="translate(140, 1530)">
    <text x="0" y="60" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" letter-spacing="4" fill="#2d1c08">RAPA DAS BESTAS 2025</text>
    <text x="0" y="125" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="34" fill="#6d4614">El ritual del curro, tensión de cuerpos y niebla en Sabucedo</text>

    <line x1="0" y1="160" x2="1200" y2="160" stroke="#9e6620" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Details Grid -->
    <text x="0" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#6d4614" opacity="0.8">LOCALIZACIÓN</text>
    <text x="0" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">SABUCEDO, GALICIA</text>

    <text x="380" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#6d4614" opacity="0.8">AÑO</text>
    <text x="380" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">2025</text>

    <text x="760" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#6d4614" opacity="0.8">SERIE</text>
    <text x="760" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">DOCUMENTAL ANTROPOLÓGICO</text>

    <g transform="translate(1040, 200)">
      <rect x="0" y="0" width="6" height="60" fill="#6d4614"/>
      <rect x="12" y="0" width="4" height="60" fill="#6d4614"/>
      <rect x="22" y="0" width="10" height="60" fill="#6d4614"/>
      <rect x="38" y="0" width="6" height="60" fill="#6d4614"/>
      <rect x="52" y="0" width="14" height="60" fill="#6d4614"/>
      <rect x="74" y="0" width="4" height="60" fill="#6d4614"/>
      <rect x="86" y="0" width="12" height="60" fill="#6d4614"/>
      <rect x="106" y="0" width="6" height="60" fill="#6d4614"/>
      <rect x="120" y="0" width="14" height="60" fill="#6d4614"/>
      <text x="75" y="80" text-anchor="middle" font-family="'Space Mono', monospace" font-size="14" fill="#6d4614">A5-RAPA-25</text>
    </g>
  </g>

  <line x1="140" y1="1970" x2="1340" y2="1970" stroke="#9e6620" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="2010" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#6d4614" opacity="0.7">CUADERNO EDITORIAL · IMPRESIÓN DUOTONO</text>
  <text x="1340" y="2010" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#6d4614" opacity="0.7">148 × 210 MM</text>
</svg>
