<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 2093" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="50%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#ece5d8"/>
    </linearGradient>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d93829"/>
      <stop offset="60%" stop-color="#ad2215"/>
      <stop offset="100%" stop-color="#73140c"/>
    </linearGradient>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c8963e" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1480" height="2093" fill="url(#paperGrad)"/>
  <rect width="1480" height="2093" fill="url(#dotGrid)"/>

  <!-- Left spine depth for booklet aesthetic -->
  <rect x="0" y="0" width="28" height="2093" fill="#8a5318" fill-opacity="0.25"/>
  <line x1="28" y1="0" x2="28" y2="2093" stroke="#b87d2b" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Editorial layout frame -->
  <rect x="80" y="80" width="1320" height="1933" fill="none" stroke="#b87d2b" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="92" y="92" width="1296" height="1909" fill="none" stroke="#b87d2b" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Registration marks -->
  <g stroke="#b87d2b" stroke-width="1" stroke-opacity="0.5">
    <line x1="60" y1="80" x2="100" y2="80"/><line x1="80" y1="60" x2="80" y2="100"/>
    <line x1="1380" y1="80" x2="1420" y2="80"/><line x1="1400" y1="60" x2="1400" y2="100"/>
    <line x1="60" y1="2013" x2="100" y2="2013"/><line x1="80" y1="1993" x2="80" y2="2033"/>
    <line x1="1380" y1="2013" x2="1420" y2="2013"/><line x1="1400" y1="1993" x2="1400" y2="2033"/>
  </g>

  <!-- Top Metadata -->
  <text x="140" y="150" font-family="'Space Mono', monospace" font-size="22" letter-spacing="4" fill="#8a5318" opacity="0.8">BENITO GONZÁLEZ QUIÑONES</text>
  <text x="1340" y="150" text-anchor="end" font-family="'Space Mono', monospace" font-size="20" letter-spacing="3" fill="#8a5318" opacity="0.65">LIBRETO 08 · €pA</text>
  <line x1="140" y1="175" x2="1340" y2="175" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Graphic Art Panel: €pA / Tipografía urbana, rótulos comerciales, ironía económica -->
  <g transform="translate(140, 240)">
    <rect width="1200" height="1200" fill="#f8f4ec" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Red graphic poster backdrop -->
    <rect x="20" y="20" width="1160" height="1160" fill="#fdfaf3"/>
    
    <!-- Bold urban poster typography: €pA -->
    <rect x="80" y="80" width="1040" height="500" fill="url(#posterGrad)"/>
    <text x="600" y="440" text-anchor="middle" font-family="'Space Mono', Impact, monospace" font-size="340" font-weight="900" letter-spacing="10" fill="#fdfcf9">€pA</text>

    <!-- Sub-label sticker -->
    <rect x="140" y="620" width="460" height="110" fill="#1f1a14"/>
    <text x="160" y="695" font-family="'Space Mono', monospace" font-size="44" font-weight="bold" letter-spacing="4" fill="#f3be58">EUROPA / CALLE</text>

    <!-- Collage of street elements and shop awnings -->
    <rect x="640" y="620" width="480" height="260" fill="#e8dec8" stroke="#8a5318" stroke-width="2"/>
    <line x1="640" y1="700" x2="1120" y2="700" stroke="#8a5318" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="660" y="660" font-family="'Space Mono', monospace" font-size="20" fill="#3a2713">REBAJAS · LIQUIDACIÓN TOTAL</text>
    <text x="660" y="750" font-family="'Space Mono', monospace" font-size="32" font-weight="bold" fill="#b93b2b">TODO A 1€ · 2€ · 5€</text>
    <text x="660" y="830" font-family="'Space Mono', monospace" font-size="18" fill="#6d543e">Rótulos comerciales y transformaciones de barrio</text>

    <!-- Bar awning pattern -->
    <polygon points="140,780 180,860 220,780 260,860 300,780 340,860 380,780 420,860 460,780 500,860 540,780 580,860 620,780" fill="#b93b2b"/>
    <rect x="140" y="860" width="480" height="280" fill="#3a2713"/>
    <!-- Glass reflections -->
    <rect x="180" y="900" width="180" height="200" fill="#f4ede2" fill-opacity="0.25"/>
    <rect x="400" y="900" width="180" height="200" fill="#f4ede2" fill-opacity="0.25"/>

    <!-- Sidewalk curb line -->
    <rect x="20" y="1120" width="1160" height="60" fill="#8a5318" fill-opacity="0.4"/>

    <!-- Inner frame crop marks -->
    <text x="50" y="70" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#8a5318" opacity="0.7">EXP. 35MM · FOMAPAN 400 · CRÓNICA DE CONSUMO</text>
    <text x="1130" y="70" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" fill="#8a5318" opacity="0.7">PLACA #08</text>
  </g>

  <!-- Typography Block -->
  <g transform="translate(140, 1530)">
    <text x="0" y="60" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" letter-spacing="4" fill="#2d1c08">€pA</text>
    <text x="0" y="125" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="34" fill="#8a5318">Rótulos vernáculos, vestigios monetarios y el pulso comercial urbano</text>

    <line x1="0" y1="160" x2="1200" y2="160" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Details Grid -->
    <text x="0" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#8a5318" opacity="0.8">LUGAR</text>
    <text x="0" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">MADRID / VIGO</text>

    <text x="380" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#8a5318" opacity="0.8">PERIODO</text>
    <text x="380" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">2024</text>

    <text x="760" y="220" font-family="'Space Mono', monospace" font-size="18" letter-spacing="3" fill="#8a5318" opacity="0.8">FORMATO</text>
    <text x="760" y="255" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#3a2713">LIBRETO A5 · PDF CERRADO</text>

    <!-- Barcode -->
    <g transform="translate(1040, 200)">
      <rect x="0" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="10" y="0" width="8" height="60" fill="#8a5318"/>
      <rect x="25" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="35" y="0" width="12" height="60" fill="#8a5318"/>
      <rect x="55" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="68" y="0" width="16" height="60" fill="#8a5318"/>
      <rect x="92" y="0" width="6" height="60" fill="#8a5318"/>
      <rect x="106" y="0" width="10" height="60" fill="#8a5318"/>
      <rect x="124" y="0" width="4" height="60" fill="#8a5318"/>
      <rect x="135" y="0" width="14" height="60" fill="#8a5318"/>
      <text x="75" y="80" text-anchor="middle" font-family="'Space Mono', monospace" font-size="14" fill="#8a5318">A5-EPA-2024</text>
    </g>
  </g>

  <!-- Bottom Page Marker -->
  <line x1="140" y1="1970" x2="1340" y2="1970" stroke="#b87d2b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="2010" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#8a5318" opacity="0.7">ARCHIVO DOCUMENTAL · FOTOGRAFÍA</text>
  <text x="1340" y="2010" text-anchor="end" font-family="'Space Mono', monospace" font-size="16" letter-spacing="3" fill="#8a5318" opacity="0.7">148 × 210 MM</text>
</svg>
