      const InteractiveGridBackground = ({ theme = 'dark' }) => {
        const [centerPos, setCenterPos] = React.useState({ x: -9999, y: -9999 });
        const dotColor = theme === 'dark' ? '#00ffff' : '#cccccc';

        React.useEffect(() => {
            const isMobile = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.innerWidth < 768;

            if (isMobile) {
                const handleOrientation = (event) => {
                    const { beta, gamma } = event;
                    if (beta === null || gamma === null) return;

                    const sensitivity = 3;
                    const offsetX = Math.max(-1, Math.min(1, gamma / 45)) * window.innerWidth / sensitivity;
                    const offsetY = Math.max(-1, Math.min(1, (beta - 45) / 45)) * window.innerHeight / sensitivity;
                    
                    setCenterPos({ 
                        x: window.innerWidth / 2 - offsetX, 
                        y: window.innerHeight / 2 - offsetY 
                    });
                };
                window.addEventListener('deviceorientation', handleOrientation);
                return () => window.removeEventListener('deviceorientation', handleOrientation);
            } else {
                const handleMouseMove = (event) => {
                    setCenterPos({ x: event.clientX, y: event.clientY });
                };
                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }
        }, []);


        const memoizedDots = React.useMemo(() => {
            const dots = [];
            const gridSize = 50;
            const numCols = Math.ceil(window.innerWidth / gridSize);
            const numRows = Math.ceil(window.innerHeight / gridSize);

            for (let i = 0; i < numCols; i++) {
                for (let j = 0; j < numRows; j++) {
                    const x = i * gridSize;
                    const y = j * gridSize;
                    const dx = x - centerPos.x;
                    const dy = y - centerPos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const maxDist = 250;
                    const influence = Math.max(0, 1 - dist / maxDist);
                    
                    const displacement = influence * 15;
                    const finalX = x - (dx / (dist || 1)) * displacement; // Avoid division by zero
                    const finalY = y - (dy / (dist || 1)) * displacement; // Avoid division by zero
                    
                    const opacity = (theme === 'dark' ? 0.05 : 0.2) + influence * 0.4;

                    dots.push({
                        key: `${i}-${j}`,
                        cx: finalX,
                        cy: finalY,
                        r: 1,
                        opacity: opacity,
                    });
                }
            }
            return dots;
        }, [centerPos.x, centerPos.y, theme]);


        return (
            <svg className="fixed top-0 left-0 w-full h-full z-0 pointer-events-none">
                <g>
                    {memoizedDots.map(dot => (
                        <circle 
                            key={dot.key} 
                            cx={dot.cx} 
                            cy={dot.cy} 
                            r={dot.r} 
                            fill={dotColor} 
                            fillOpacity={dot.opacity}
                            style={{ transition: 'cx 0.1s ease-out, cy 0.1s ease-out, fill-opacity 0.1s ease-out' }}
                        />
                    ))}
                </g>
            </svg>
        );
      };

          { key: 'architecture', label: 'Arquitectura' },
          { key: 'design', label: 'Diseño' },
          { key: 'escenografias', label: 'Escenografías' },
        ];
        
        const contactFilter = { key: 'contact', label: 'Contacto' };
        
        return (
          <React.Fragment>
            {/* Desktop and Mobile Top Bar */}
            <div className="hidden md:flex fixed top-4 left-4 z-20 space-x-2 bg-black/30 backdrop-blur-sm p-1 rounded-full">
              {filters.map(filter => (
                <button
                  key={filter.key}
                  onClick={() => onFilterChange(filter.key)}
                  className={`px-3 py-1 text-xs sm:text-sm font-mono uppercase tracking-wider rounded-full transition-all duration-200 ${
                    currentFilter === filter.key
                      ? 'bg-cyan-400 text-black shadow-lg'
                      : 'text-white hover:bg-white/20'
                  }`}
                >
                  {filter.label}
                </button>
              ))}
            </div>
            {/* Mobile */}
            <div className="md:hidden fixed top-0 left-0 w-full z-20 flex space-x-2 bg-black/50 backdrop-blur-sm p-2 overflow-x-auto hide-scrollbar">
               {filters.map(filter => (
                <button
                  key={filter.key}
                  onClick={() => onFilterChange(filter.key)}
                  className={`flex-shrink-0 px-3 py-1 text-xs font-mono uppercase tracking-wider rounded-full transition-all duration-200 ${
                    currentFilter === filter.key
                      ? 'bg-cyan-400 text-black shadow-lg'
                      : 'text-white hover:bg-white/20'
                  }`}
                >
                  {filter.label}
                </button>
              ))}
            </div>
            
            {/* Shared Bottom Contact Button */}
             <div className="fixed bottom-6 left-0 w-full z-20 flex justify-center p-2 pointer-events-none">
               <button
                  key={contactFilter.key}
                  onClick={() => onFilterChange(contactFilter.key)}
                  className={`pointer-events-auto px-4 py-2 sm:px-5 sm:py-2.5 font-mono text-[10px] sm:text-xs uppercase tracking-wider rounded-full bg-black bg-opacity-50 border transition-all duration-300 backdrop-blur-sm ${
                    currentFilter === contactFilter.key
                      ? 'text-black bg-white border-white'
                      : 'border-gray-700 text-gray-400 hover:bg-white/10 hover:border-gray-500 hover:text-white'
                  }`}
                >
                  {contactFilter.label}
                </button>
            </div>
          </React.Fragment>
        );
      };
      
      const WelcomeModal = ({ onClose }) => (
        <div className="fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-[#111] bg-opacity-80 backdrop-blur-md border border-gray-700 rounded-lg shadow-2xl max-w-sm w-full p-6 text-center relative text-white">
            <button
              onClick={onClose}
              className="absolute top-2 right-2 text-gray-500 hover:text-white transition-colors text-3xl leading-none"
              aria-label="Cerrar"
            >
              &times;
            </button>
            <h2 className="text-xl font-bold font-mono uppercase tracking-wider text-cyan-400 mb-4">¡Bienvenido!</h2>
            <p className="text-gray-300">
                Esta página aún está en desarrollo, disfrútala y disculpa las molestias.
            </p>
          </div>
        </div>
      );

      // MAIN APP
      const App = () => {
        const [view, setView] = React.useState({ page: 'home', projectId: null });
        const [filter, setFilter] = React.useState('all');
        const [relativeMousePosition, setRelativeMousePosition] = React.useState({ x: 0, y: 0 });
        const [hoveredProjectImage, setHoveredProjectImage] = React.useState(null);
        const [slideshowImage, setSlideshowImage] = React.useState(null);
        const [bgImage, setBgImage] = React.useState(null);
        const [bgOpacity, setBgOpacity] = React.useState(0);
        const [disruptSignal, setDisruptSignal] = React.useState(0);
        const [showWelcome, setShowWelcome] = React.useState(true);
        const [isGalleryMode, setIsGalleryMode] = React.useState(false);


        const handleEyeClick = () => {
          setDisruptSignal(c => c + 1);
        };

        React.useEffect(() => {
          // Preload ALL project images to make the hover effect instant
          const allImages = allProjectsData
            .filter(p => p.normalImage)
            .map(p => p.normalImage);
          
          allImages.forEach(src => {
            const img = new Image();
            img.src = src;
          });
        }, []); // Run only once on component mount

        React.useEffect(() => {
            // interval logic removed
        }, [hoveredProjectImage, view.page]);

        React.useEffect(() => {
            const handleMouseMove = (event) => {
                // For the eye icon, relative to center
                if (['home', 'architecture', 'design', 'scenography', 'subcategory'].includes(view.page)) {
                    setRelativeMousePosition({
                        x: event.clientX - window.innerWidth / 2,
                        y: event.clientY - window.innerHeight / 2
                    });
                }
            };
            
            window.addEventListener('mousemove', handleMouseMove);

            return () => {
                window.removeEventListener('mousemove', handleMouseMove);
            };
        }, [view.page]);
        
        React.useEffect(() => {
          const validPages = ['home', 'architecture', 'design', 'scenography', 'subcategory'];
          if (hoveredProjectImage && validPages.includes(view.page)) {
            setBgImage(hoveredProjectImage);
            setBgOpacity(1);
          } else {
            setBgOpacity(0);
          }
        }, [hoveredProjectImage, view.page]);

        React.useEffect(() => {
          const html = document.documentElement;
          const body = document.body;
          
          if (['home', 'architecture', 'design', 'scenography', 'subcategory'].includes(view.page)) {
            html.style.overflow = 'hidden'; body.style.overflow = 'hidden';
          } else {
            html.style.overflow = 'auto'; body.style.overflow = 'auto';
          }
          
          window.scrollTo(0, 0);

          let bgColor = '#000'; // default dark
          if (view.page === 'project') {
              const project = allProjectsData.find(p => p.id === view.projectId);
              const carouselProjects = ['festa-na-terra', 'cronologia-adios', 'coleccion-grabados', 'territorios-digitales'];
              const isCarouselView = carouselProjects.includes(project?.id);
              if (project && project.id !== 'hashima-animal-park' && !isCarouselView) {
                  bgColor = '#fff'; // light for all projects except Hashima and carousel projects
              }
          }

          html.style.backgroundColor = bgColor;
          body.style.backgroundColor = bgColor;

          return () => {
            html.style.overflow = 'auto'; body.style.overflow = 'auto';
          };
        }, [view.page, view.projectId]);
        
        const handleFilterChange = (newFilterKey) => {
            setHoveredProjectImage(null);
            setFilter(newFilterKey);
            const pageMap = {
                'architecture': 'architecture',
                'design': 'design',
                'escenografias': 'scenography',
                'contact': 'contact'
            };

            if (pageMap[newFilterKey]) {
                setView({ page: pageMap[newFilterKey], projectId: null });
            } else { // This handles 'all'
                setView({ page: 'home', projectId: null });
            }
        };

        const handleProjectSelect = React.useCallback((projectId, isPage = false) => {
          const project = allProjectsData.find(p => p.id === projectId);
          if (project?.isPage && project.targetPage) {
            setView({ page: project.targetPage, projectId: null });
            return;
          }
          if (project?.isCategoryNode) {
            setFilter(project.targetCategory);
            setView({ page: project.targetCategory, projectId: null });
            return;
          }
          if (isPage || project?.isPage) {
             setView({ page: projectId, projectId: null });
             return;
          }
          if (project && project.id === 'carteleria') {
              setView({ page: 'carteleria', projectId });
          } else {
              setView({ page: 'project', projectId });
          }
        }, []);

        const handleNodeClick = React.useCallback((node) => {
          if (node.isProject && node.projectId) {
            const project = allProjectsData.find(p => p.id === node.projectId);
            if (project?.isPage) {
              handleProjectSelect(node.projectId, true);
            } else {
              handleProjectSelect(node.projectId, false);
            }
            return;
          }
          switch (node.id) {
            case 'ARQUITECTURA': setFilter('architecture'); setView({ page: 'architecture', projectId: null }); break;
            case 'DISEÑO': setFilter('design'); setView({ page: 'design', projectId: null }); break;
            case 'ESCENOGRAFÍAS': setFilter('scenografias'); setView({ page: 'scenography', projectId: null }); break;
            case 'CONTACTO': setFilter('contact'); setView({ page: 'contact', projectId: null }); break;
          }
        }, [handleProjectSelect]);
        
        const handleGoHome = () => {
          setHoveredProjectImage(null);
          setFilter('all');
          setView({ page: 'home', projectId: null });
        };

        const handleRandomProject = React.useCallback(() => {
            const validProjects = allProjectsData.filter(p => !p.isCategoryNode && p.id !== 'CENTRAL_HUB');
            if (validProjects.length > 0) {
                const randomProject = validProjects[Math.floor(Math.random() * validProjects.length)];
                handleProjectSelect(randomProject.id, !!randomProject.isPage);
            }
        }, [handleProjectSelect]);

        const handleBack = () => {
            setHoveredProjectImage(null);
            const standalonePages = ['generacion-ia', 'web-design', 'escritos-arquitectura', 'escrito-detail'];
            if (view.page === 'project' || view.page === 'carteleria' || standalonePages.includes(view.page)) {
                if (view.page === 'escritos-arquitectura') {
                    setFilter('architecture');
                    setView({ page: 'architecture', projectId: null });
                    return;
                }
                if (view.page === 'escrito-detail') {
                    setView({ page: 'escritos-arquitectura', projectId: null, escritoId: null });
                    return;
                }
                const project = allProjectsData.find(p => p.id === view.projectId);
                
                if (standalonePages.includes(view.page) || (project && project.category === 'design')) {
                    if (project && project.subcategory) {
                        setView({ page: 'subcategory', subcategory: project.subcategory });
                    } else {
                        setFilter('design');
                        setView({ page: 'design', projectId: null });
                    }
                    return;
                }
                
                if (project && (project.category === 'architecture')) {
                    setFilter(project.category);
                    setView({ page: project.category, projectId: null });
                    return;
                }
                 
                if (project && project.category === 'escenografias') {
                    setFilter('scenography');
                    setView({ page: 'scenography', projectId: null });
                    return;
                }

                handleGoHome();

            } else if (['architecture'].includes(view.page)) {
                setFilter('architecture');
                setView({ page: 'architecture', projectId: null });
            } else if (view.page === 'subcategory') {
                const subcategoryProjects = allProjectsData.filter(p => p.subcategory === view.subcategory);
                const category = subcategoryProjects.length > 0 ? subcategoryProjects[0].category : 'design';
                setFilter(category);
                setView({ page: category, projectId: null });
            } else if (['architecture', 'design', 'scenography', 'contact'].includes(view.page)) {
                handleGoHome();
            }
        };
        
        const handleProjectHover = React.useCallback((project) => {
          setHoveredProjectImage(project ? project.normalImage : null);
        }, []);
        
        const backButtonTheme = React.useMemo(() => {
            if (view.page === 'project') {
                const project = allProjectsData.find(p => p.id === view.projectId);
                const carouselProjects = ['festa-na-terra', 'cronologia-adios', 'coleccion-grabados', 'territorios-digitales'];
                const isCarouselView = carouselProjects.includes(project?.id);
                return (project && (project.id === 'hashima-animal-park' || isCarouselView)) ? 'dark' : 'light';
            }
            return 'dark';
        }, [view.page, view.projectId]);

        const handleSubcategorySelect = React.useCallback((subcategory) => {
          setView({ page: 'subcategory', subcategory });
        }, []);

        const renderContent = () => {
          switch (view.page) {
            case 'home':
              return (
                <div className="w-full h-full flex items-center justify-center relative">
                  <h1 className="sr-only">Benito González Quiñones - Portfolio de Arquitectura y Diseño. Arquitecto Madrid.</h1>
                  {!isGalleryMode && (
                      <>
                          <div 
                            className="central-eye absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 cursor-pointer"
                            onClick={handleEyeClick}
                            title="Observa más de cerca..."
                          >
                            <EyeIcon mousePosition={relativeMousePosition} />
                          </div>
                          <div className="absolute top-0 left-0 w-full h-full z-10">
                            <NetworkGraph onNodeClick={handleNodeClick} filter={filter} disruptSignal={disruptSignal} />
                          </div>
                      </>
                  )}
                  {isGalleryMode && (
                      <div className="absolute top-0 left-0 w-full h-full z-10">
                         <GalleryView filter={filter} onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} mousePosition={relativeMousePosition} />
                      </div>
                  )}
                </div>
              );
            case 'architecture':
              if (isGalleryMode) return <div className="absolute top-0 left-0 w-full h-full z-10"><GalleryView filter="architecture" onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} /></div>;
              return <OrbitalPage category="architecture" title="ARQUITECTURA" onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} onProjectHover={handleProjectHover} showEye={true} mousePosition={relativeMousePosition} />;
            
            
            case 'design':
              if (isGalleryMode) return <div className="absolute top-0 left-0 w-full h-full z-10"><GalleryView filter="design" onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} /></div>;
              return <OrbitalPage category="design" title="DISEÑO" onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} onProjectHover={handleProjectHover} showEye={true} mousePosition={relativeMousePosition} />;
            case 'scenography':
              if (isGalleryMode) return <div className="absolute top-0 left-0 w-full h-full z-10"><GalleryView filter="scenography" onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} /></div>;
              return <OrbitalPage category="escenografias" title="ESCENOGRAFÍAS" onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} onProjectHover={handleProjectHover} showEye={true} mousePosition={relativeMousePosition} />;
            case 'subcategory': {
              if (isGalleryMode) return <div className="absolute top-0 left-0 w-full h-full z-10"><GalleryView filter={filter} subcategory={view.subcategory} onProjectSelect={handleProjectSelect} onSubcategorySelect={handleSubcategorySelect} /></div>;
              const subcategoryProjects = allProjectsData.filter(p => p.subcategory === view.subcategory);
              const category = subcategoryProjects.length > 0 ? subcategoryProjects[0].category : 'design';
              return <OrbitalPage category={category} subcategory={view.subcategory} title={view.subcategory} onProjectSelect={handleProjectSelect} onProjectHover={handleProjectHover} showEye={true} mousePosition={relativeMousePosition} />;
            }
            case 'contact':
              return <ContactPage />;
            case 'carteleria': {
                const project = allProjectsData.find(p => p.id === view.projectId);
                return <CarteleriaPage project={project} />;
            }
            case 'generacion-ia': {
                return <AIStudioPage />;
            }
            case 'web-design': {
                return <WebDesignPage />;
            }
            case 'escritos-arquitectura': {
                return <EscritosPage onEscritoSelect={(id) => setView({ page: 'escrito-detail', escritoId: id })} />;
            }
            case 'escrito-detail': {
                const escrito = window.escritosData.find(e => e.id === view.escritoId);
                return <EscritoDetailPage escrito={escrito} onBack={handleBack} />;
            }
            case 'project':
              const project = allProjectsData.find(p => p.id === view.projectId);
              return <ProjectDetailPage project={project} allProjectsData={allProjectsData} onProjectSelect={handleProjectSelect} onBack={handleBack} />;
            default:
              return null;
          }
        }

        return (
          <div className="w-full h-full relative">
            {showWelcome && <WelcomeModal onClose={() => setShowWelcome(false)} />}
            <div
                className="fixed inset-0 z-0 transition-opacity duration-700 ease-in-out pointer-events-none"
                style={{
                    backgroundImage: `url(${bgImage})`,
                    backgroundSize: 'cover',
                    backgroundPosition: 'center',
                    opacity: bgOpacity,
                    filter: 'blur(8px) brightness(0.5)',
                    maskImage: 'radial-gradient(circle at center, transparent 20%, black 35%)',
                    WebkitMaskImage: 'radial-gradient(circle at center, transparent 20%, black 35%)',
                }}
            />
            
            {['home', 'architecture', 'design', 'scenography', 'contact'].includes(view.page) && <FilterControls currentFilter={filter} onFilterChange={handleFilterChange} />}
            {['home', 'architecture', 'design', 'scenography', 'subcategory'].includes(view.page) && (
                <>
                  <button 
                    onClick={() => setIsGalleryMode(!isGalleryMode)}
                    className="absolute bottom-8 left-4 md:left-8 z-30 w-10 h-10 sm:w-11 sm:h-11 bg-black bg-opacity-50 rounded-full flex items-center justify-center text-gray-400 backdrop-blur-sm border border-gray-700 transition-all duration-300 hover:bg-white/10 hover:border-gray-500 hover:text-white hover:scale-110"
                    title={isGalleryMode ? 'Volver a Constelación' : 'Modo Galería'}
                  >
                    {isGalleryMode ? (
                        <svg width="22" height="22" viewBox="-50 -50 100 100">
                            <g opacity="0.6">
                                <path d="M 0 -40 C 20 -20, 20 20, 0 40 C -20 20, -20 -20, 0 -40 Z" fill="currentColor" transform="rotate(45)"/>
                                <path d="M 0 -40 C 20 -20, 20 20, 0 40 C -20 20, -20 -20, 0 -40 Z" fill="currentColor" transform="rotate(-45)"/>
                            </g>
                            <g>
                                <circle cx="0" cy="0" r="10" fill="currentColor" />
                            </g>
                        </svg>
                    ) : (
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    )}
                  </button>
                  <button 
                    onClick={handleRandomProject}
                    className="absolute bottom-8 right-4 md:right-8 z-30 px-4 py-2 sm:px-5 sm:py-2.5 bg-black bg-opacity-50 rounded-full border border-gray-700 text-gray-400 font-mono text-[10px] sm:text-xs uppercase tracking-wider flex items-center justify-center hover:bg-white/10 hover:border-gray-500 hover:text-white transition-all duration-300 backdrop-blur-sm"
                    title="Abre un proyecto al azar"
                  >
                    Probar suerte
                  </button>
                </>
            )}
            {/* {view.page !== 'home' && <HomeButton onClick={handleGoHome} />} */}
            {['project', 'carteleria', 'generacion-ia', 'web-design', 'escritos-arquitectura', 'escrito-detail'].includes(view.page) && <BackButton onClick={handleBack} theme={backButtonTheme} />}
            {renderContent()}
          </div>
        );
      };

      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }

    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
