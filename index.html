    "id": "compo1",
    "title": "¿Frío o caliente?",
    "date": "Otoño 24/25",
    "summary": "Análisis de las Viviendas Sociales 1737 de HArquitectes y la transición entre lo exterior y lo interior.",
    "text": "¿Cómo se define una experiencia arquitectónica cuando cada límite se convierte en un umbral?\n¿Qué papel juegan los espacios de transición, esos amortiguadores que suavizan el cambio entre dos estados opuestos? A veces, la arquitectura no ofrece un tránsito gradual, sino que enfrenta al usuario con una transición dura, abrupta, en la que el contraste entre lo interior y lo exterior, entre lo cálido y lo frío, se convierte en el verdadero protagonista. Otras, es la coexistencia del contraste y la transición la que permite generar espacios articulados entre dos extremos.\n\nComo si fuera un simple medio, un objeto a través del cual puedes observar y habitar las montañas. Así veo las Viviendas Sociales 1737 de HArquitectes. El proyecto parece buscar un equilibrio entre la monumentalidad y la habitabilidad, pero plantea la pregunta: ¿hasta qué punto estos opuestos se integran de manera efectiva? Las transiciones entre exterior e interior parecen ser duras al hablar de un cuerpo tan permeable, estos son ingredientes que logran generar una experiencia que puede resultar tanto estimulante como conflictiva. Es en estos casos donde el carácter transicional cobra mayor importancia, en un mundo de contrastes. Es en esta ambigüedad donde los materiales y las decisiones formales cobran relevancia, comenzando con el podio y las viviendas que lo coronan.\n\nEn duro hormigón, los bloques construyen una doble dialéctica en todos los sentidos. El primero de ellos en su estructura volumétrica. En contacto con el suelo, un gran podio de hormigón genera espacios abiertos y volúmenes muy definidos, duros y frios que hablan de un exterior. Sobre ese podio, una serie forjados, unidos visualmente por unas lamas de madera crean lo que claramente identificamos como las viviendas, con carpinterias de madera que aportan calidez, separándose del volumen inicial y creando dicha distinción desde el primer momento.\n\nSi saltamos al interior de las viviendas, es directa la apreciación de la dicotomía planteada en alzado. Un espacio en hormigón, frío, abierto y permeable. Este espacio vincula tanto visual como atmosféricamente el espacio interior, más refinado, que habla del adentro, con acabados finos de pladur blanco.\n\nA pesar de coexistir de una forma contraria, la vivienda desvanece el interior con el exterior por medio del perímetro, donde las grandes superficies acristaladas y los balcones perimetrales no solo difuminan el límite físico entre ambos, sino que también desdibujan la intención del proyecto. ¿Es este un espacio que busca integrarse o separarse del entorno?\n\nAunque estas transiciones parecen ofrecer continuidad, la percepción final no es tan clara. La interacción entre el hormigón, la madera y el vidrio no siempre logra articular una atmósfera equilibrada, dejando una sensación de fragmentación en lugar de síntesis.\n\nLas galerías, concebidas como espacios intermedios, funcionan como amortiguadores visuales, pero no terminan de ser acogedoras en un sentido más humano. Aunque en planta parecen invitar al habitante a ocuparlas, su escala y materialidad sugieren más bien un carácter residual, algo que se podría interpretar como un fallo en su capacidad de definir un uso objetivo.\nPor otro lado, el interior de las viviendas, definido por su austeridad y limpieza formal, contrasta con estas transiciones de manera casi excesiva, reforzando la desconexión en lugar de construir una narrativa espacial coherente.\n\nLa eterna lucha entre el monumento y la escala de lo humano. Este proyecto parece debatirse entre lo que pretende comunicar y lo que efectivamente transmite. La tensión entre lo frío y lo cálido, entre lo monumental y lo habitable, sigue presente en cada rincón, pero queda la duda de si esta ambigüedad es una estrategia intencionada o una consecuencia de decisiones formales que no terminan de dialogar entre sí.\n\nPersonalmente, es al explorar sus espacios y relaciones, cuando me aborda la sensación de que el proyecto se sitúa en un territorio ambiguo, sin comprometerse del todo con una narrativa clara. ¿Es esta tensión un gesto consciente que busca provocar al usuario, o es el resultado de una estrategia formal que prioriza el contraste sobre la cohesión? Tal vez lo valioso del proyecto no reside en su capacidad para resolver estas dicotomías, sino en el debate que genera sobre cómo habitamos y entendemos el concepto de comodidad en el hogar contemporáneo.",

    "id": "compo2",
    "title": "A ver si nos aclaramos",
    "date": "Otoño 24/25",
    "summary": "El problema de la industrialización del arquitecto en la Casa Garoza.",
    "text": "Año 295 Después de Ford (o año 2845 de la Era Común - e.c.). La familia Johnson quiere adquirir una edificación de vivienda mínima para su terreno a las afueras del nuevo bosque, ubicado en lo que solíamos llamar Madrid. Eligen un módulo A de cocina comedor, y le añaden un único habitáculo de descanso (Z), ya que, de momento, no se les ha asignado “cría” alguna. Es el espacio de reconciliación natural perfecto para ambos. El montaje es rápido: En pocos días, ya tienen a su entera disposición la nueva casa industrializada. Yo me pregunto, ¿podría esto ser así? Y, si fuera tan bueno, ¿por qué no está ya en nuestro día a día?\n\nLa Casa Garoza nace atendiendo a unas necesidades concretas, para las cuales se establecen unas normas que ordenan dichas peticiones. La planta baja se estructura mediante una banda más ancha para las estancias (A) y una más estrecha para tránsito entre las primeras y el segundo nivel (B). En la segunda altura, resguardándose del exterior y con un ambiente más privado, se ubica una habitación doble: un espacio que podríamos considerar como un módulo independiente, llamémoslo (Z).\n\nAunque esta proyección atiende a unas exigencias iniciales, con el paso del tiempo, es inevitable que cambien. La familia aumenta, y se necesitan tres módulos de dormitorio más. Si decidimos olvidar la articulación de módulos, podríamos intuir la ampliación como una sencilla adhesión de tres módulos (Z). Sin embargo, es la configuración inicial la que desatiende el principio de industrialización a favor de la forma, impidiendo así continuar con el orden inicial. \nPara solucionar el problema, los arquitectos añaden una segunda banda de servicios para zonas húmedas y rellenan el espacio sobrante con habitaciones, pero esta vez sin atender a un módulo concreto. Y, como no podía ser de otra forma, venden este nuevo espacio como un nuevo módulo industrializado y adaptable a cualquier tipo de modificación, ampliable hasta el infinito.\n\nNo es mi intención tratar como ignorantes a los lectores incidiendo en la absurdez de dichas declaraciones. Simplemente, debemos revisar la sucesión de hechos.\nEn búsqueda de una unidad mínima de vivienda, y, suponiendo que el espacio previo de comedor, cocina y zona de estar fuera suficiente para 5, la incógnita se encontraría en cómo disponer tres habitaciones siguiendo las normas iniciales. Dormitorios en un nivel superior, más íntimo, acceso desde una plataforma de distribución y un módulo único para todas las habitaciones, pues todas necesitan lo mismo: el mínimo.\n\nEs la arquitectura de lo vernáculo, la “architecture without architects” de cualquier pueblo. La casa que derriba un tabique y añade una habitación. Una habitación que, con los años, se convierte en trastero, oficina o garaje. Es esa arquitectura que va en contra del manifiesto que Casa Garoza defiende, y que sin embargo, se queda en palabras, la que, con su propia evolución, se deja en evidencia frente a sus principios. ¿No sería mejor evitar establecer normas que no se pueden cumplir?",

    "id": "compo3",
    "title": "Un trío: Lina, Corbu y Mies",
    "date": "Otoño 24/25",
    "summary": "La diagramática construcción del tipo y la elección de posturas.",
    "text": "Sobre un gran podio flota un rígido espacio, como si fuese un OVNI desde el cual sus habitantes admiran el imponente contexto sobre el que se alza este edificio. Un observatorio sobre cristales que permite un espacio sensorialmente fluido, que invita a ser atravesado con algo más que la mirada. En este objeto contrastan mundos, materiales y dialécticas; resuenan aires de arquitecturas cerradas, pero a la vez abiertas. Pero, ¿cómo se organizan estas decisiones, a qué atienden y a qué tipología recurren?\n\nComo si de Mies se tratara, el estudio Arrhov Frick planta un podio que homogeneiza el terreno sobre el que nace una planta baja construida con muros de vidrio, constituyendo un espacio libre, organizado en torno a una “caja dentro de la caja” que concentra todas las instalaciones. En esta primera planta, el espacio busca relacionarse con el exterior, volcando su interés hacia el entorno. Este objetivo se satisface más que plenamente y, para lograrlo, no solo se emplea un diagrama tipológico que recuerda obras como la Casa Farnsworth, sino que también se recurre a una materialidad discursiva con el contexto, creando relaciones con el rocoso terreno que la rodea y empatizando con él.\n\nEsto contrasta totalmente con lo que se experimenta en la segunda planta, la cual acoge estancias de descanso que buscan cerrarse sobre sí mismas, observando el contexto desde un lugar más distante. En esta planta, se adopta un esquema compacto que organiza los espacios y reduce las aperturas hacia el exterior, utilizándolas como marcos para el paisaje, tal como Le Corbusier plantea en sus famosos “cinco puntos para una nueva arquitectura”. \n\nAdemás, siguiendo un mismo hilo discursivo, para lograr lo opuesto a lo que se ve en la planta baja, se aborda el problema en dirección contraria. Si en la inferior apreciamos una relación material de iguales, en la superior encontramos la madera, un material que contrasta con el exterior. Siendo cálido y acogedor nos invita a permanecer en la cama sin querer salir. Sin duda, podríamos trazar una comparación con los interiores de Frank Lloyd Wright.\n\nAsí, el uso de tipologías para responder a fines específicos genera un diagrama que, a su vez, construye el proyecto. La imagen exterior del edificio es el resultado de estas decisiones proyectuales. Juntar piezas y cambiar el discurso del edificio en función de ciertos factores y formas de habitar el espacio es lo que caracteriza esta obra, y la hace muy similar a la forma de trabajar de Lina Bo Bardi en la Casa de Cristal, donde el espacio también se divide en dos: una parte abierta hacia el exterior y otra, más privada, que se recoge sobre sí misma.\n\nLa capacidad de recurrir a un amplio repertorio de tipologías, articulándolas de manera óptima para abordar un caso concreto, es sin duda la forma de crear buena arquitectura. Lo vemos en Lina Bo Bardi con la \"Casa de Cristal\", y lo vemos en Arrhov Frick con esta impresionante actuación.",

    "id": "compo4",
    "title": "Cómo construir para la gente",
    "date": "Otoño 24/25",
    "summary": "Leyes que derivan del juego a la arquitectura en el Jardín de infancia de Bohinj.",
    "text": "Extendiéndose sobre la preexistente escuela Janeza Mencingerja, el Jardín de infancia de los estudios ARREA y KA L A toma identidad propia mediante la articulación de sus partes y la subordinada independencia programática y formal entre estas. Y si se preguntan cómo este oxímoron puede construir buena arquitectura, puedo darle dos respuestas: La Con tres tejados a dos aguas y un hall, o con algo un poco más complejo.\n\nEs obvio que un edificio como una guardería tiene adscrita de forma inherente una doble visión; la del adulto, que es el maestro, y la del niño. Pero, en realidad, estos últimos son los verdaderos clientes. Las personas que, como arquitectos, debemos habitar, poniéndonos a la altura de sus ojos y en la piel de sus problemas.\n\nQuizás el momento más traumático para el niño, los padres y, por tanto, también los maestros, es el de la despedida. La puerta al cambio de etapa, la primera emancipación. El suceso ocurre en el núcleo del edificio. Es un espacio que honra la importancia del momento a la vez que articula y distribuye los cuerpos programáticos, los cuales se abren, acogiendo y abrazando este suceso.\n\nRespecto a los cuerpos anexos al hall, podemos hablar de dos largos brazos y un tercer apéndice que, con una condición conectiva más limitada, configura un espacio deportivo y de ejercicio físico. Es un programa puntual y por tanto más independiente del conjunto. \n\nLos “brazos” se organizan como una enfilada de espacios que, a su vez, se modulan mediante cápsulas programáticas insertas sobre un trazado en tartán. Es en estas decisiones donde vemos un proyecto de interacciones y encuentros, los cuales se consiguen mediante la ruptura de la caja y el carácter conectivo del intersitico (entendido como el “espacio entre”). \nUna sucesión de espacios al más claro estilo medieval nos hace pasear entre aulas forzando encuentros e interacciones sociales. El patrón se repite en el máximo de puntos posibles; vemos también enfiladas de ventanas creando simétrica respecto a los pasillos.\n\nPor otro lado, vemos un juego continuo en el vaivén entre escalas, aunque quizás se queda como algo anecdótico en ciertas decisiones. Por ejemplo, la preocupación por la seguridad infantil es notable, y se percibe en acciones como la de forrar un perfil metálico para evitar golpes, procurar esquinas en madera o proyectar suelos continuos. Sin embargo, en ciertos puntos, lo formal parece revelarse, dejando a la vista peligrosos bordes esquineros como los que acontecen bajo las escaleras del hall. \n\nLa calidad de un proyecto se encuentra en la importancia de las decisiones. El jardín de infancia de Bohinj es un proyecto con una geometría abierta, que a pesar de sus fuertes tensiones espaciales es la forma la que está a disposición de la función. Un proyecto así ha de comportarse como tal desde las decisiones más generales hasta la última de ellas, sin dejar pasar por alto ningún aspecto formal. Es la función la que ha de construir lo estético; algo será bonito si es útil, pero no siempre útil por, simplemente, ser bonito. Podemos afirmar que ARREA y KA L A se acercan mucho a esta compleja concepción. A pesar de no haber sido proyectado con este objetivo, sería imposible argumentar que este edificio no es atractivo.",

  {
    "id": "compo5",
    "title": "Si los techos hablaran...",
    "date": "Otoño 24/25",
    "summary": "Práctica vs proyecto: análisis constructivo y espacial de la Casa LA 20.",
    "text": "Casa LA 20, un proyecto que cuenta más con su materialización que con su nombre. Mostrándose en techos y reflejándose en los suelos, el edificio exterioriza, no solo su carácter constructivo y estructural, sino también como es concebido formal y compositivamente. ¿Hace esta sinceridad estructural que el edificio sea mejor? ¿Cambiaría algo si los techos fueran de Pladur y los suelos vinílicos?\n\nCuál cabaña vitruviana la casa crece en torno a la chimenea. Forjados unidireccionales que pivotan sobre el fuego, hablan de un módulo que se repite cuatro veces en aspa. Entre los brazos aparecen estancias cuadradas que dialogan con la dirección estructural del módulo adyacente, creando así un espacio anexo a la par que individual respecto al núcleo.\n\nEs fácil caer en la búsqueda de un fin utilitario para la sinceridad constructiva, la cual en este caso es reiterada en la modulación y orden de los suelos. Si bien no hay que buscar un porqué más allá de la dignificación de la técnica, la Casa LA muestra como un discurso que usa como base este fín puede transformar mediante la dialéctica material un lugar entendido como concéntrico y homogéneo en otro segregado y con ambientes perfectamente diferenciados.\n\nAl percibir el edificio desde otro punto es cuando la técnica empleada cobra sentido: Si hiciéramos el ejercicio mental de sustituir los mosaicos de suelos y techos, podríamos llegar, sin dar muchas vueltas, a otra esquematización del espacio. Ahora, en este nuevo objeto no sólo las estancias adosadas carecen de conexión con las centrales, si no que, además, es el propio núcleo el que se unifica, perdiendo cuatro estancias que ceden a un todo. Las terrazas pasan de entenderse como una extensión del espacio interior a ser un adosado meramente simbólico, un “porche”.\n\nLas decisiones constructivas y de proyecto han de nacer de un mismo discurso ya que por medio de la técnica es que se empieza a materializar el resultado y por tanto no puede quedar exenta del proceso de pensamiento. Cambiar la forma de abordar el proyecto, entender la construcción como una herramienta más en el discurso y no como un problema a resolver. El mundo clásico, el gótico, el movimiento moderno o el High-tech son algunos de los títulos que recogen cientos de lecciones sobre cómo la construcción asienta las bases de la arquitectura. La veracidad y optimización constructiva otorga sentido y por tanto “Estilo” a las formas, las cuales elevan la arquitectura, tal y como Alberti defiende, a un nivel espiritual.",

    "id": "compo6",
    "title": "Dale una vuelta",
    "date": "Otoño 24/25",
    "summary": "Espacialidad texturada y caos petrificado en la 'Casa Damero'.",
    "text": "“Hola, arqui. Quiero una casa to’ moderna, muy simple, así con ventanales enormes, como los noruegos, pero que no me vean mucho desde fuera, que es rarete, tú ya sabes.”\nSeguramente no fue lo que Jesús Donaire vivió cuando le encargaron la “Casa Damero”, pero tampoco resultaría extraño, ya que, aparentemente, podría cumplir a la perfección dicha premisa.\n\nUna forma fuerte, un prisma rígido que, al más puro estilo de Chillida, es horadado con un aparente orden, inflexible en cuanto a su dialéctica con el ámbito funcional. El “por qué” más allá de la forma es claro: aportar luz natural a todos los espacios que lo requieran y, al mismo tiempo, establecer una relación visual y continuidad espacial entre exterior e interior.\n\nHasta aquí todo es lógico y consecuente. Sin embargo, al cruzar esta frontera, el \"Chillidismo\" se acerca más al “rollo” de Steven Holl. Los espacios habitan esta carcasa según lo requieran: aquellos que buscan una relación fuerte con el “rededor” se sirven de los espacios abiertos; en cambio, aquellos que buscan cerrarse sobre sí mismos, ocupan los puntos ciegos. En cuanto al interior, cambia esta actitud rígida de la forma y, esta vez, es la cantidad de luz la que se regula en relación con los espacios, mediante tragaluces en el caso de las escaleras o con dobles alturas en el del salón.\n\nEs así como la Casa Damero se construye estereotómicamente de fuera a dentro, para tomar un discurso propio en el interior, más tectónico, en favor de lo funcional. Es esta doble dialéctica la que dota de sentido a los espacios, creando diferencias reales entre escultura y arquitectura, como si la gruta de Canterra hubiese sido creada por el hombre para luego transformar su interior en favor del confort.\n\nSiendo esta dicotomía formal, la característica principal del proyecto, cabe preguntarse: ¿podría haberse habitado el prisma con una lógica en relación a la volumetría aparente? O, visto de otro modo, ¿podría el exterior reflejar de forma sincera aquello que sucede en el interior? El prisma busca una unidad que invite a ser percibida desde todas sus caras, mientras que el interior busca aportar complejidad atmosférica a este volumen primitivo mediante la adecuación de los espacios a sus funciones. Jesús Donaire busca una heterogeneidad nada simple, una arquitectura en relación con un entorno peninsular.\n\nSi al empezar este texto creías que la “Casa Damero” caía en todos los clichés, déjame decirte que estabas equivocado: “dale una vuelta”.",

    "id": "compo7",
    "title": "El poder transformador de la arquitectura",

    "summary": "¿Realidad o ficción? El impacto urbano y social del proyecto en Saint Blaise.",
    "text": "Fruto del desarrollo urbanístico del pasado siglo, nos hemos visto encerrados en verdaderas distopías residenciales. En el caso de España, contamos con ciudades como Sanchinarro, Alcorcón o San Cugat del Vallés: infinitas hileras de casas, un interminable espacio usado para poco más que comer y dormir. Son buenos ejemplos de planes urbanos con un único objetivo: rentabilidad económica a corto plazo.\n\nSi bien hoy se siguen cometiendo dichas atrocidades, de las cuales los arquitectos no somos menos culpables, cada vez la conciencia urbanística en Europa está más volcada hacia desarrollos sostenibles y autogestionados. Sin embargo, la dura realidad tras tanta palabrería sigue afectando a miles de personas. ¿Qué vamos a hacer con todo lo tejido hasta hoy? ¿Hacia dónde han de evolucionar los barrios únicamente residenciales? ¿Está un PAU condenado a la muerte?\n\nLas ciudades se leen, las ciudades se escriben y cuentan cómo es que funcionamos, pensamos y existimos. En este mundo de cuentos, podemos dar el Nobel a la “ciudad barroca”, que no es otra que aquella que ha crecido de forma espontánea, que mezcla usos porque así lo requiere y que no se puede planear porque nace del vivir de su gente.\nEl cuadernillo rubio, ordenado y que nadie quiere abrir, es la ciudad que la gente ocupa sin más remedio. Dura realidad contemporánea que, con hartas faltas de ortografía, es escrita por el capitalismo.\n\nA pesar de ser un problema de lo más actual, toda esta corriente crítica es fruto de una evolución conceptual que tuvo su punto clave en los años 60-70 del siglo pasado. En esta época surgen una serie de movimientos que reivindicaban un cambio con respecto al alto desarrollismo que dominó las décadas posteriores a la 2ª Guerra Mundial.\n\nSaint Blaise es la ciudad más densa de Europa; en la periferia de París encaja perfectamente con todos los prototipos criticados hasta aquí. Con el objetivo de complejizar el ritmo del contexto urbano, el estudio Bruther aterriza un nuevo bloque sobre un pequeño claro que acontece entre bloques.\n\nContando con una temprana tradición, este centro cultural sigue la labor social empezada por otros proyectos como el jardín urbano “ECObox” en La Chapelle o el “56stBlaise” en el mismo Saint Blaise. El fin es albergar actividades y usos que enriquezcan la vida en el barrio, hacer de “condensador social”. ¿Es la solución tan simple como poner centros sociales? ¿Qué es lo que hace a un barrio estar vivo? ¿Cómo se crea hoy en día una “ciudad barroca”?\n\nHablando en primera persona, me enorgullece ser de un pueblo, haber crecido jugando en las calles, tener una historia ligada a un suelo y fuertes vínculos con vecinos y costumbres. Una ciudad cobra vida cuando se habita, no cuando se reside; es decir, cuando se crean lazos, recuerdos y vivencias. Todo esto desencadena un sentimiento de pertenencia a una comunidad y, a su vez, una identidad. \nBruther, con esta intervención, intenta crear un espacio que, con la “excusa” de albergar labores sociales, contribuya a dar forma a una ciudad que podamos llamar hogar.\n\nHaciendo un juicio de valor y observando cómo es que el contexto ha reaccionado a la inserción del bloque, podemos ver que espacios de esta tipología son un punto de inflexión en las vidas de las personas, tan variadas como las formas del edificio. Y, si bien estas iniciativas deben ir acompañadas de otras intervenciones, es el buen recibimiento de la gente lo que demuestra la relevancia de los problemas urbanísticos del modelo de ciudad residencial.",

    "text": "El edificio residencial Hebelstrasse es, sin duda alguna, un camino adecuado hacia una buena vivienda. Soy capaz de afirmarlo sin darle más de una vuelta. Viviendas amables con el entorno, con espacios de calidad y bien construidas. El 90% de los estudiantes madrileños, entre los que me incluyo, darían todo lo que tienen (o les queda) por vivir en cualquier “cosa” que pueda parecerse a esto. Partiendo desde esta consideración, la cual considero esencial, el caso puede ser estudiado cuestionando sus partes, orden y forma.\n\nHebelstrasse constituye una singularidad con respecto al conjunto que ocupa (la urbanización residencial Maiengasse). Tal es su singularidad que cada una de sus viviendas es una solución particular en sí misma, algo que podría justificarse si todas respondieran a un mismo tipo.\n\nVolcando sobre un salón como estancia principal, este (por lo general) conforma un cuello de botella, construyendo espacialmente un recibidor. Dicha tensión se establece entre dos espacios que, enfrentados, se abren hacia el dominante salón.\n\nComo no puede ser de otra forma, todas las bandadas tienen su patito feo, y este complejo también. El cuarto tipo de esta planta modelo ocupa el espacio sobrante de estos caprichosos reveses. Abriendo directamente sobre el gran salón, este espacio rompe con el tipo propuesto hasta ahora. Si bien cada uno de los espacios construía una autonomía espacial condicionada por la continuidad espacial, esta disposición de espacios no conserva un mínimo resquicio de aquellos principios organizadores. El baño, anexo al dormitorio, se desvincula del salón. La cocina pierde el carácter propio, cediendo al salón de estar.\n\nEs aquí cuando salen a la luz los problemas que tiene no contemplar el tipo como base de una estructura. En contrapartida, el hermano mayor de este complejo usa formas regulares y espacios seriados, muy similares entre sí. Entre ellos, se amoldan los unos a los otros gracias a la simplicidad geométrica de los espacios.\n\nA la hora de proyectar vivienda colectiva, hay que buscar una metodología simple pero audaz, que permita la resolución del problema tipológico sin conceder oportunidad a la singularidad y, por tanto, a la posibilidad de errar en los propósitos establecidos. Por culpa de la baja especificación geométrica y los caprichos formales, la residencia Hebelstrasse peca de tener una de cada cuatro viviendas de calidad notablemente inferior en relación con sus compañeras. Esto va más allá de los metros cuadrados o número de habitaciones: es un problema de orden y tipo.",

    "text": "Limitar la relación del exterior con la casa sin afectar a su conversación con el exterior, este es el objetivo que Chipperfield aborda al definir una frontera. \n¿Complejizar la forma estructural soluciona una relación directa con el exterior?\n¿Limita esta decisión la organización de espacios? Es decir, ¿se puede conseguir un mismo resultado sin ceñirse a estrictas normas de borde?\n\nUn jardín denso rodeado de un muro opaco crea la primera línea que desdibuja la frontera real de la vivienda; Si bien el espacio privado empieza con el primer muro, no se entra realmente a la vivienda hasta que uno cruza este tamiz.\n\nEl edificio se estructura mediante la unión de tres partes. La primera, que es la central y más alta, organiza el resto de cuerpos siendo única en su tipo. La entrada principal de la vivienda se manifiesta en uno de los laterales de la pieza, es pequeña y realmente no busca ser ostentosa. A partir de aquí y a lo largo del eje vertical del edificio, este espacio constituye una articulación que conecta y separa los dos cuerpos colindantes, estableciendo sus funciones y grados de privacidad.\n\nEn la planta baja, con una relación más directa con el exterior, encontramos las salas menos privadas, a un lado el comedor y al otro las cocheras y la cocina.\nSi subimos al primer piso, se encuentran las habitaciones y dormitorios. Debido a la altura, la relación con el exterior se limita a los huecos de ventana. Chipperfield, a lo largo del proyecto, sigue una norma: no abrirse hacia la calle principal, sino hacia los laterales y patios interiores. Quiere intimidad, busca tamizar la gente que puede acceder a estos espacios. Vemos como nos cuenta todo mediante el grafismo en planta, trazando muros más gruesos para estos espacios íntimos, y así hace tangible el afán por aislar las habitaciones del mundo exterior, casi como si de una hipérbole se tratase. El muro más grueso es el de la habitación principal, seguido de el que separa las habitaciones más pequeñas de la calle principal. \n\nTodo esto funciona tal y como se propone, sin embargo, en ciertos puntos surgen problemas. En este caso, es al necesitar un ventanal que se abra frente al campanario de la iglesia, en la acera contraria. Para solucionar esta paridad se dispone un espacio residual, entre el distribuidor y la habitación principal, creando así la posibilidad de observar un icono que no perjudique a la intimidad de las habitaciones. \nEsta decisión complejiza el proyecto solo por seguir unas normas iniciales; en cierto modo se presenta un problema que contradice unas normas establecidas. Este es un ejemplo de cómo, en ocasiones, hay que hacer malabares, creando una enfilada para un fin muy simple: disponer una vista hacia una iglesia.\n\nLas decisiones rotundas crean buenos proyectos. Se hace al plantar tres grandes volúmenes y al decidir que ninguna habitación se relacione con la calle. Sin embargo, es en ciertos puntos donde este mismo principio obliga al arquitecto a aportar soluciones de problemas con las que no llega a ningún lado.",

    "id": "valor_estetico",
    "title": "El valor estético de la técnica",
    "date": "2021",
    "category": "ensayo",
    "summary": "Reflexión sobre cómo la técnica y el uso de materiales considerados feos (hormigón, barro, ladrillo) adquieren un valor estético intrínseco en la arquitectura.",
    "tags": [
      "ensayo",
      "técnica",
      "estética",
      "brutalismo",
      "vernácula",
      "efímera"
    ],
    "images": [],
    "text": "\"EL VALOR ESTÉTICO DE LA TÉCNICA\"\n\nÍNDICE\n1. Introducción\n2. ¿Por qué?\n3. Estilos\n   3.1. - Brutalismo\n   3.2. - Arquitectura vernácula\n   3.3. - Arquitectura efímera o de emergencia\n4. Casos de estudio\n   4.1. JOÃO BATISTA VILANOVA ARTIGAS\n   4.2. Francis Kere\n   4.3. Shigeru Ban\n5. Resumen/ Conclusión\n6. Bibliografía\n\nINTRODUCCIÓN\nEste trabajo busca dotar de valor estético a la técnica y realzar la belleza de un material sin tratar, mostrando la técnica y el por qué de una obra como parte de ésta.\nYa sea por abaratar costes, por temas culturales o por puro esteticismo, son muchos los arquitectos que han decidido usar materiales considerados feos para la mayoría de la gente. En este ensayó hablaré de aquellos arquitectos que se propusieron tratar con delicadeza algo tan bruto como el hormigón, el barro o el ladrillo, para obtener resultados increíbles y dignos de mencionar en este ensayo.\nEl uso de materiales que carecen de esteticismo y belleza para crear arte es un tópico empleado más allá de la arquitectura, por ejemplo, en el arte conceptual del s.XX. Cabe mencionar a el artista Joseph Beuys, quien tras un accidente como piloto en la 2º guerra mundial y las experiencias posteriores a este trabajó con materiales poco atractivos considerados desechos y los llamó arte. Este es uno de los pioneros en esta filosofía que trato en este ensayo pero sin duda quien la aplicó de forma más literal. Movimientos como el brutalismo se plantean cuestiones similares a las de este artista.\n\nSi hablamos de técnicas que utilizan materiales vistos destacan especialmente tres. En primer lugar el brutalismo que representa todos los ideales mencionados anteriormente, la arquitectura vernácula, que es la propia de cada lugar, que ha nacido sin ser influenciada por otras culturas, por ejemplo la propia de las tribus de África del Norte, creada con los materiales más accesibles, piedra y adobe. En tercer lugar hablaremos de la arquitectura efímera o provisional, pensada para ser construida rápidamente sin que afecte al entorno y para que desaparezca con el tiempo, por lo cual no se recrea en la calidad de los materiales más allá de lo esencial.\n\n¿POR QUÉ?\nDesde que empecé a leer el libro “el valor de la materia” por el cual me vi influenciado a escribir este ensayo, me sentí en cierto modo identificado y tras entablar una discusión con un compañero acerca del valor estético del arte, llegamos a posturas encontradas, es más, no conseguimos llegar a una conclusión objetiva. Sin embargo, llegué a la obviedad de que no todo lo que es bello tiene que ser arte, ni todo el arte ha de ser atractivo. Está reflexión me hizo derivar a temas relacionados, en concreto las ramas del arte y su esencia fundamental. Si bien una pintura paisajística es bella y se puede considerar arte, un paisaje no es arte pero sí puede ser considerado bello. En esencia este mismo concepto se puede extrapolar a la mancha el ruido o la roca, entre otros.\nEn resumen, este ensayo tratará distintas facetas del brutalismo, la arquitectura vernácula y la efímera, el entorno en relación con el arte y el valor de lo estético desde un punto de vista formal, técnico y cultural.\n\n1.- BRUTALISMO\nGran Bretaña, S XX, tras acabar la Segunda Guerra Mundial vino una etapa de escasez y pensamiento alternativo (...) Al firmar la paz miles de soldados volvieron a la vida cotidiana y el estado tenía que integrarlos en esta con un lugar donde vivir y unas condiciones dignas. Fruto de esta necesidad surge la arquitectura brutalista, la cual buscaba crear grandes viviendas de protección oficial que fuesen monumentales racionales y sobre todo económicas. Inspirándose en proyectos de Eero Saarinen y de Le Corbusier nació el brutalismo, nombre relacionado con el término francés, béton brut, el material más usado en este movimiento.\nEl brutalismo se fundamenta en la economía constructiva la monumentalidad y la estética global del conjunto, omitiendo el valor estético del material hasta el punto de considerar una ofensa “tapar”, por ejemplo, el hormigón.\nA pesar de recibir su nombre de este material, el brutalismo extrapola sus puntos fundamentales al uso de otros materiales, más allá del hormigón.\n\nArquitectura Brutalista en España\nLa arquitectura brutalista en españa se concentra mayormente en Madrid con obras tan icónicas como la casas blancas de el maestro Francisco Javier Sainz de Oiz o las de un arquitecto cuya obra me resulta una de las más atractivas en este movimiento, Fernando Higueras con obras como el instituto del patrimonio cultural de España (...)\n\n1.2 ARQUITECTURA VERNÁCULA\n«Con ocasión del fuego surgieron entre los hombres las reuniones (...) comenzaron unos a procurarse techados utilizando ramas y otros a cavar grutas bajo los montes (...)» Esto es la arquitectura vernácula, una arquitectura que nace y se desarrolla de forma independiente en un lugar y con una cultura concreta.\nCuando se habla de arquitectura vernácula más o menos todos tenemos claro que hace referencia a edificaciones utilitarias y de subsistencia. Hoy en día son cada vez más los arquitectos que luchan por la reivindicación de esta arquitectura como una forma de enorgullecerse de su tradición local y por motivos económicos y de sostenibilidad.\n\n1.3 ARQUITECTURA EFÍMERA\nEn la antigua Roma, los soldados se veían obligados a estar fuera de las ciudades (...) Los arcos del triunfo, hechos de madera, estaban pensados para ser construidos rápidamente y cumplir una función puntual. La arquitectura efímera se caracteriza esencialmente por que está pensada para durar unos días o incluso unos meses, pero la esencia es finita. No daña el entorno y da la oportunidad a los arquitectos de experimentar sin riesgo con materiales baratos y livianos.\n\n2. CASOS DE ESTUDIO\n2.1 JOÃO BATISTA VILANOVA ARTIGAS (Arquitectura brutalista)\n2.2 FRANCIS KÉRÉ (Arquitectura vernácula)\n2.3 SHIGERU BAN (Arquitectura efímera)\n\n3. CONCLUSIÓN\nLa materia tiene una función muy importante en cuanto a lo estructural se refiere, pero también cumple un montón de funciones diferentes. Mediante la estética se reivindican valores propios de culturas. La labor de un arquitecto debe ir más allá de crear una estructura funcional; debe preocuparse por todo lo que la arquitectura arrastra, economía, cultura y medio ambiente."
  },

    "title": "Recopilación de ejercicios de historia",
    "date": "2023",
    "category": "historia",
    "summary": "Colección de textos, ensayos comparativos y reflexiones sobre figuras e hitos clave de la historia de la arquitectura.",
    "tags": [

    "text": "RECOPILACIÓN DE EJERCICIOS DE HISTORIA\n\nTEXTOS\n1. De Architectura y De Re Aedificatoria\n2. La arquitectura de Laugier y la de Boulle\n3. Viollet Le Duc y John Ruskin\n4. Le Corbusier y Adolf Loos\n\nCONFERENCIAS\n5. Sobre la conferencia de Miguel Sobrino\n6. Sobre la conferencia de Linazasoro\n\nIDENTIFICACIÓN Y COMPARACIÓN\n7. Parcial 1º\n8. Parcial 2º\n\n1. De Architectura y De Re Aedificatoria\nUn milenio y medio separa a estos libros, libros que comparten un mismo ADN. De Architectura, más conocido como El Vitruvio, es un libro que fue mandado escribir a Marco Vitruvio Polión, dicho encargo, realizado por Augusto tenía como objetivo compendiar todas las ideas y técnicas griegas siendo traducidas al latín.\nTras objetivar y desprender de todo idolatro a El vitruvio, Alberti decide modernizar esta “biblia del arquitecto”, esta vez con un carácter más resolutivo que informativo, escribiendo De Re Aedificatoria.\nAmbos defienden la arquitectura como un arte digno, ennobleciendola y desprendiendo la idea de oficio. Alberti aporta innovaciones que podemos considerar problemas contemporáneos como el mantenimiento de infraestructuras para luchar contra el tiempo, \"pertinaz destructor de las cosas\".\n\n2. La arquitectura de Laugier y la de Boulle\nJunto con la revolución industrial surgen corrientes de pensamiento como la ilustración. El pensamiento científico se estaba instaurando en la sociedad. Laugier mira hacia Vitruvio y reinterpreta la parábola del origen de la arquitectura añadiendo la variable estructural para teorizar sobre la evolución y los orígenes del templo griego.\nBoulle trata la arquitectura como una experiencia estética a la cual se ha de llegar por medio de la construcción. Para Boulle, la arquitectura ha de ser como la pintura pero en tres dimensiones, con la luz y las sombras perfilando volúmenes.\n\n3. Viollet Le Duc y John Ruskin\nAutores del siglo XIX, contemporáneos a la revolución industrial. John Ruskin concibe la arquitectura como un reflejo de la sociedad, un recipiente del trabajo personal y artesanal. Por otro lado, Le Duc asienta su forma de juzgar la arquitectura por medio de un estilo que trasciende lo estético para relacionar forma y función, enfocándolo en una cuestión estructural y de sinceridad.\n\n4. Adolf Loos y Le Corbusier\nLa arquitectura moderna crece en base a ideas como las de Adolf Loos y Le Corbusier. Ambos arquitectos tratan el ornamento a su manera. Para Loos, el ornamento y el arte no tiene nada que ver con la utilidad.\n\n5. Sobre la conferencia de Miguel Sobrino\nEl arte como representación del pensamiento. Para crear buena arquitectura, al igual que buen arte, son necesarios un pensamiento y una reflexión previa.\n\n6. Sobre la conferencia de Jose Ignacio Linazasoro\nLa arquitectura del contexto. Linazasoro demuestra que la arquitectura mejora exponencialmente cuando se empieza a tener un respeto por el arquitecto al que precedes.\n\n7. Ejercicio de identificación 1\nAnálisis de elementos ornamentales, ritmos, sombras y tipos que nos permiten ubicar una obra desde el renacimiento italiano, manierismo, hasta la arquitectura herreriana o rococó.\n\n8. Ejercicio de comparación 2\nComparando cúpulas históricas, espacios fluidos de Wright frente a Mies Van der Rohe, y la aproximación exterior-interior de Loos frente a Le Corbusier en la Villa Savoye."

          {filteredData.length === 0 && (
            <div className="py-12 text-center text-[#666666] font-mono uppercase tracking-widest text-sm">

};

        { id: 'escritos-arquitectura', category: 'architecture', title: 'ESCRITOS / PUBLICACIONES', isPage: true, targetPage: 'escritos-arquitectura' },
        { id: 'gritar-lo-publico', category: 'architecture', subcategory: 'PROYECTOS', title: 'GRITAR LO PÚBLICO', normalImage: 'imagenes/gritar-main.png', rolloverImage: 'imagenes/gritar-main-rollover.png', summary: 'El proyecto materializa la convivencia de usos opuestos organizándose en torno a una crujía central de circulación.', description: 'El proyecto materializa la convivencia de usos opuestos\norganizándose en torno a una crujía central de circulación.\nMientras que un lado alberga la privacidad constante\nde las habitaciones, el lado opuesto funciona como un\nmotor híbrido, alternando planta por planta espacios de\nproducción cultural y centros de procesamiento de datos.\nGracias a las dobles alturas, se rompe la hermeticidad\nde los servidores, creando un ecosistema visual donde la\ntecnología y la cultura cohabitan sin mezclarse\nFinalmente, el edificio se corona con un volumen superior\ntraslúcido y ligero, que se disuelve en el cielo durante\nel día y se convierte en una linterna urbana por la noche,\nreforzando la idea de un espacio público vibrante y accesible.\n\nLiberar suelo para ganar ciudad. El proyecto reinterpreta el espacio público mediante una plaza\ntopográfica estructurada que sutura la diferencia de alturas del entorno, devolviendo al barrio una\nmayor libertad de movimiento y acceso a espacios verdes de calidad vitales.\nMás que un edificio objeto, se plantea un edificio puerta, cuya materialidad estratificada narra esta\nintención de apertura. El volumen se ancla firmemente al terreno mediante un robusto zócalo de\npiedra rugosa, una base casi geológica que dialoga con la nueva topografía. Sobre esta base, el cuerpo\nprincipal se envuelve en una piel de ladrillo de tono cálido, aportando textura y una escala cívica y\namable al entorno urbano.', images: ['imagenes/gritar-lo-publico-(1).png', 'imagenes/gritar-lo-publico-(2).png', 'imagenes/gritar-lo-publico-(3).png', 'imagenes/gritar-lo-publico-(4).png', 'imagenes/gritar-lo-publico-(5).png', 'imagenes/gritar-lo-publico-(6).png', 'imagenes/gritar-lo-publico-(7).png', 'imagenes/gritar-lo-publico-(8).png', 'imagenes/gritar-lo-publico-(9).png'], pdf: 'pdfs/gritar-lo-publico.pdf' },
        { id: 'anexo-aemet', category: 'architecture', subcategory: 'PROYECTOS', title: 'Anexo AEMET', normalImage: 'imagenes/anexo-aemet-main.png', rolloverImage: 'imagenes/anexo-aemet-main-rollover.png', summary: 'Ampliación de las oficinas de la AEMET, buscando una integración respetuosa con el entorno y una alta eficiencia energética.', description: 'El proyecto para el anexo de la AEMET se centra en la creación de un espacio de trabajo moderno y sostenible. La propuesta busca no solo ampliar la capacidad de las oficinas, sino también mejorar la calidad del entorno laboral a través de la luz natural, la vegetación integrada y materiales de bajo impacto ambiental. La forma del edificio responde a un análisis exhaustivo del soleamiento y las vistas, optimizando el confort térmico y visual para los usuarios.', images: ['imagenes/anexo-aemet-1.png', 'imagenes/anexo-aemet-2.png', 'imagenes/anexo-aemet-3.png', 'imagenes/anexo-aemet-4.png', 'imagenes/anexo-aemet-5.png', 'imagenes/anexo-aemet-6.png', 'imagenes/anexo-aemet-7.png'], pdf: null },
        { id: 'hashima-animal-park', category: 'architecture', subcategory: 'PROYECTOS', title: 'Hashima Animal Park', normalImage: 'imagenes/hashima-main.png', rolloverImage: 'imagenes/hashima-main-rollover.png', summary: 'Proyecto conceptual para la revitalización de la isla de Hashima a través de un parque de animales y centro de investigación de la fauna marina.', description: 'Hashima Animal Park es una propuesta utópica para transformar la abandonada "isla acorazada" en un santuario para la vida salvaje y un centro de investigación. El proyecto respeta la estructura existente de la isla, integrando nuevos recintos y laboratorios de forma mínimamente invasiva. La idea es crear un diálogo entre la ruina industrial y la naturaleza, generando un nuevo ecosistema donde la fauna pueda prosperar y los visitantes puedan aprender sobre la importancia de la conservación.', images: ['imagenes/hashima-(1).png', 'imagenes/hashima-(2).png', 'imagenes/hashima-(3).png', 'imagenes/hashima-(4).png', 'imagenes/hashima-(5).png', 'imagenes/hashima-(6).png', 'imagenes/hashima-(7).png', 'imagenes/hashima-(8).png', 'imagenes/hashima-(9).png', 'imagenes/hashima-(10).png', 'imagenes/hashima-(11).png', 'imagenes/hashima-(12).png', 'imagenes/hashima-(13).png', 'imagenes/hashima-(14).png', 'imagenes/hashima-(15).png', 'imagenes/hashima-(16).png', 'imagenes/hashima-(17).png', 'imagenes/hashima-(18).png', 'imagenes/hashima-(19).png', 'imagenes/hashima-(20).png'], pdf: null },
        { id: 'paseo-dehesa', category: 'architecture', subcategory: 'PROYECTOS', title: 'PASEO DEHESA', normalImage: 'imagenes/paseodehesa-main.png', rolloverImage: 'imagenes/paseodehesa-main-rollover.png', summary: 'Intervención paisajística en La Dehesa de la Villa para conectar el norte y sur del parque. Propone tres estaciones (servicios, meteorológica, mirador) para reactivar la zona sur y crear espacios de refugio y reunión.', description: 'Intervención Paisajistica en La Dehesa de la Villa\nArchitectural Paisajism\nEl ejercicio solicita la instalación de tres estaciones con el objetivo de readaptar el nexo sur de la dehesa de la villa y aportar usos y apoyos al lugar.\n\nLos requerimientos esenciales establecidos en el ejercicio son:\n\n- una estación de servicios\n\n- una estación metereológica\n\n- un mirador\n\nLa implantación de estas piezas será ubicada en el lugar en relación con su derredor, fomentando el desarrollo del entorno más allá de su función inmediata. El ejercicio lo he abordado mediante una gran estructuración en dos partes. Una primera que estudia, traza y justifica un plan general que deduzca el cómo y el porqué de cada estación. Una red de infraestructura. El objetivo principal de mi intervención es conectar el norte del parque (espacio hoy en día más concurrido) con el sur, espacio colindante con las universidadesl. Readaptar el espacio que hoy en día es usado como “trastero de la dehesa”. Buscar el refugio en el entorno inmediato de la urbe. Crear espacios de reunión y evasión, (cómo) volcándose sobre sí mismo y reforzando ese carácter de pulmón verde que la dehesa debería de constituir.\n\nEste proyecto comienza siendo una geometría desordenada de planos trazados a mano alzada. Posteriormente, se le impone una geometría basada en circunferencias de cinco radios distintos y tangencias entre ellas. Para ordenar las geometrías, se disponen de forma ordenada y atendiendo a los usos que estas albergarán. Una vez distribuidas en la parcela, se le superpone una retícula de pilares.', images: ['imagenes/paseodehesa-1.png', 'imagenes/paseodehesa-2.png', 'imagenes/paseodehesa-3.png', 'imagenes/paseodehesa-4.png'], pdf: null },
        { id: 'el-escorial', category: 'architecture', subcategory: 'INVESTIGACIÓN', title: 'COCINA MONACAL DE EL ESCORIAL', normalImage: 'imagenes/elescorial-main.png', rolloverImage: 'imagenes/elescorial-main-rollover.png', summary: 'Investigación sobre la disposición original y evolución de la cocina del Monasterio del Escorial, basada en análisis documental de tratados renacentistas y estudios comparativos de cocinas monásticas.', description: 'Investigación Arquitectónica\nEl objetivo principal de este estudio es formular una hipótesis objetiva sobre la disposición y características originales de la cocina del Monasterio del Escorial en el momento de su construcción, así como explorar su evolución a lo largo del tiempo. Para abordar esta investigación, se desarrolló una metodología en varias fases, comenzando con un exhaustivo análisis documental centrado en ejemplos históricos y contemporáneos comparables.\n\nEn la primera fase, se revisaron tratados y grabados de la época, como el "Libro de Cozina" de Bartolomeo Scappi y los tratados de Bartolomeo Banchetti, los cuales detallan las necesidades funcionales de las cocinas renacentistas, así como la disposición y uso de utensilios comunes. Estos documentos proporcionaron un marco de referencia inicial sobre cómo se organizaban los espacios culinarios en contextos similares.\n\nPosteriormente, se profundizó en la investigación consultando trabajos académicos relevantes, como el Trabajo Fin de Grado de Alberto Pretianni, que analiza tres casos de estudio que guardan semejanzas con la cocina del Escorial: la cocina del Monasterio de Fontevraud, la de la Conciergerie en París y la villa de Poggioreale en Italia. De estos estudios, se extrajeron valiosas conclusiones sobre los métodos de extracción de humo, un aspecto crucial en la funcionalidad de las cocinas monásticas de la época.\n\nAdemás, se estudiaron las cocinas de otros monasterios como los de Sintra y Alcobaça, para identificar posibles métodos de higienización del espacio, un aspecto fundamental para entender la operatividad y mantenimiento de estas áreas en contextos históricos.\n\nCon todos estos datos, se han formulado varias hipótesis sobre la posible distribución y organización del espacio en la cocina del Monasterio del Escorial, tomando en cuenta las actividades culinarias que se desarrollaban y las necesidades funcionales del momento. Este estudio ofrece una visión detallada y fundamentada de cómo pudo haber sido este importante espacio, y cómo su diseño pudo haber evolucionado con el tiempo.', images: ['imagenes/elescorial-1.png', 'imagenes/elescorial-2.png', 'imagenes/elescorial-3.png', 'imagenes/elescorial-4.png', 'imagenes/elescorial-5.png', 'imagenes/elescorial-6.png', 'imagenes/elescorial-7.png', 'imagenes/elescorial-8.png', 'imagenes/elescorial-9.png', 'imagenes/elescorial-10.png', 'imagenes/elescorial-11.png'], pdf: null },
        { id: 'ia-render', category: 'architecture', subcategory: 'PROYECTOS', title: 'RENDERIZADO IA', normalImage: 'imagenes/iarender-main.png', rolloverImage: 'imagenes/iarender-main-rollover.png', summary: 'Exploración conceptual de cómo la IA expande los horizontes del diseño arquitectónico, manifestando visualmente las posibilidades estéticas que emergen al colaborar con algoritmos generativos.', description: 'Una exploración conceptual sobre cómo las herramientas de inteligencia artificial pueden expandir los horizontes del diseño arquitectónico. Este proyecto no representa una construcción física, sino un manifiesto visual de las posibilidades estéticas y formales que emergen al colaborar con algoritmos generativos.', images: ['imagenes/iarender-1.png', 'imagenes/iarender-2.png', 'imagenes/iarender-3.png', 'imagenes/iarender-4.png'], pdf: null },
        { id: 'coleccion-de-curvas', category: 'architecture', subcategory: 'PROYECTOS', title: 'COLECCIÓN DE CURVAS', normalImage: 'imagenes/colecciondecurvas-main.png', rolloverImage: 'imagenes/colecciondecurvas-main-rollover.png', summary: 'Diseño de oficinas como un paisaje de usos, creando estancias delimitadas por espacios verdes. La geometría se basa en circunferencias y tangencias ordenadas en una retícula para mejorar la calidad del trabajo.', description: 'El proyecto “Colección de curvas” busca dibujar un paisaje de usos, unas oficinas que sean paisaje y una experiencia para el día a día. Crear una vorágine de estancias delimitadas entre sí mediante espacios verdes, terrazas y callejones. El objetivo es proyectar unas oficinas que mejoren la calidad del trabajo o hagan de este una parte cómoda de la rutina. Para lograr todo esto, buscamos combinar una serie de espacios, con formas de habitarlos flexibles a la par que específicas. Este proyecto comienza siendo una geometría desordenada de planos trazados a mano alzada. Posteriormente, se le impone una geometría basada en circunferencias de cinco radios distintos y tangencias entre ellas. Para ordenar las geometías, se disponen de forma ordenada y atendiendo a los usos que estas albergarán. Una vez distribuidas en la parcela, se le superpone una retícula de pilares.', images: ['imagenes/colecciondecurvas-1.png', 'imagenes/colecciondecurvas-2.png', 'imagenes/colecciondecurvas-3.png', 'imagenes/colecciondecurvas-4.png', 'imagenes/colecciondecurvas-5.png', 'imagenes/colecciondecurvas-6.png', 'imagenes/colecciondecurvas-7.png', 'imagenes/colecciondecurvas-8.png', 'imagenes/colecciondecurvas-9.png', 'imagenes/colecciondecurvas-10.png'], pdf: null },
        { id: 'arboles-y-telas', category: 'architecture', subcategory: 'PROYECTOS', title: 'ÁRBOLES Y TELAS', normalImage: 'imagenes/arbolesytelas-main.png', rolloverImage: 'imagenes/arbolesytelas-main-rollover.png', summary: 'Centro social en Pereira, Colombia, diseñado para la multifuncionalidad de los espacios, buscando minimizar el desuso y permitir que las áreas alberguen diversas actividades más allá de su función principal.', description: 'Centro social en Pereira, Colombia\nArchitectural Design\nEs un proyecto desarroyado para la asignatura de proyectos 5\nEl objetivo de este proyecto reside en la multifunción de los espacios, buscando minimizar el espacio en desuso. Es decir, que los espacios puedan albergar actividades auna vez su función principal haya terminado', images: ['imagenes/arbolesytelas-1.png', 'imagenes/arbolesytelas-2.png', 'imagenes/arbolesytelas-3.png', 'imagenes/arbolesytelas-4.png', 'imagenes/arbolesytelas-5.png'], pdf: null },
        { id: 'prato-food-city', category: 'architecture', subcategory: 'PROYECTOS', title: 'PRATO FOOD CITY', normalImage: 'imagenes/prato-main.png', rolloverImage: 'imagenes/prato-main-rollover.png', summary: 'Erasmus+BIP en Italia. El proyecto "Ring of Prato" conecta áreas en desuso para transformarlas en tierras de cultivo, promoviendo la educación pública y la cultura gastronómica local.', description: 'Erasmus+BIP en Italia\n\nThe “The Ring of Prato” project emerges with the intention of connecting large unused areas through physical and visual connections. These spaces have significant potential to explore the richness of local gastronomic culture. The project’s vision is to transform these vast extensions into cultivated lands that promote public education.\n\nFurthermore, extensive green areas with different characteristics are observed, extending like branches around the current city, projected as zones for future urban growth. As a whole, this project forms a ring that embraces the current city, delineating spaces shared by society, where food and the rural environment take center stage and exploring new areas that allow future urban growth, prioritizing pedestrians.', images: ['imagenes/prato-1.png', 'imagenes/prato-2.png', 'imagenes/prato-3.png', 'imagenes/prato-4.png', 'imagenes/prato-5.png', 'imagenes/prato-6.png', 'imagenes/prato-7.png', 'imagenes/prato-8.png'], pdf: null },

      // COMPONENTS
      const EyeIcon = ({ mousePosition }) => {
        const [pupilTransform, setPupilTransform] = React.useState('translate(0, 0)');

        React.useEffect(() => {
            const isMobile = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.innerWidth < 768;

            if (isMobile) {
                const handleOrientation = (event) => {
                    const { beta, gamma } = event; // beta: front-to-back, gamma: left-to-right
                    if (beta === null || gamma === null) return;
                    
                    const maxPupilOffset = 15;
                    // Normalize gamma and beta to a range of [-1, 1] and apply offset
                    const pupilX = Math.max(-1, Math.min(1, gamma / 45)) * maxPupilOffset;
                    // Subtract 45 from beta to make the eye look forward when the phone is held at a natural angle
                    const pupilY = Math.max(-1, Math.min(1, (beta - 45) / 45)) * maxPupilOffset;
                    
                    setPupilTransform(`translate(${pupilX}, ${pupilY})`);
                };

                window.addEventListener('deviceorientation', handleOrientation);
                return () => window.removeEventListener('deviceorientation', handleOrientation);
            } else {
                if (!mousePosition) return;
                const maxPupilOffset = 15;
                const { x, y } = mousePosition;
                const angle = Math.atan2(y, x);
                const screenHypot = Math.sqrt(window.innerWidth * window.innerWidth + window.innerHeight * window.innerHeight) / 2;
                const mouseHypot = Math.sqrt(x * x + y * y);
                const normalizedDistance = Math.min(mouseHypot, screenHypot);
                const pupilX = Math.cos(angle) * maxPupilOffset * (normalizedDistance / screenHypot);
                const pupilY = Math.sin(angle) * maxPupilOffset * (normalizedDistance / screenHypot);
                setPupilTransform(`translate(${pupilX}, ${pupilY})`);
            }
        }, [mousePosition]);

        return (
            <svg viewBox="-100 -100 200 200" className="w-[120px] h-[120px] md:w-[200px] md:h-[200px]">
              <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
                  <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <g opacity="0.15">
                <path d="M 0 -80 C 40 -40, 40 40, 0 80 C -40 40, -40 -40, 0 -80 Z" fill="white" transform="rotate(45)"/>
                <path d="M 0 -80 C 40 -40, 40 40, 0 80 C -40 40, -40 -40, 0 -80 Z" fill="white" transform="rotate(-45)"/>
              </g>
              <g>
                <path d="M 0 -70 L 70 0 L 0 70 L -70 0 Z" fill="#333333" stroke="gray" strokeWidth="0.5"/>
              </g>
              <g filter="url(#glow)" transform={pupilTransform} style={{ transition: 'transform 0.2s ease-out' }}>
                <circle cx="0" cy="0" r="45" fill="#555555" />
                <circle cx="0" cy="0" r="30" fill="#888888" />
                <circle cx="0" cy="0" r="15" fill="#CCCCCC" />
                <circle cx="0" cy="0" r="7" fill="white" />
              </g>
            </svg>
        );
      };

      const NetworkGraph = ({ onNodeClick, filter, disruptSignal }) => {
        const svgRef = React.useRef(null);
        const simulationRef = React.useRef(null);
        const [tooltip, setTooltip] = React.useState({ visible: false, content: '', x: 0, y: 0 });

        React.useEffect(() => {
          if (disruptSignal > 0 && simulationRef.current) {
              const nodes = simulationRef.current.nodes();
              const strength = 25;
              nodes.forEach(node => {
                  if (!node.isCentral) {
                      const angle = Math.atan2(node.y || 0, node.x || 0);
                      node.vx += Math.cos(angle) * strength;
                      node.vy += Math.sin(angle) * strength;
                  }
              });
              simulationRef.current.alpha(1).restart();
          }
        }, [disruptSignal]);

        React.useEffect(() => {
          if (!svgRef.current) return;
          
          const isMobile = window.innerWidth < 768;
          const width = window.innerWidth;

          const categorySummaries = {
            'ARQUITECTURA': 'Proyectos que exploran la relación entre el espacio, la forma y la función.',
            'DISEÑO': 'Creación de objetos y experiencias visuales, desde carteles hasta productos.',
            'ESCENOGRAFÍAS': 'Diseño de ambientes y atmósferas para contar historias en el espacio.'
          };
          
          // --- Data Filtering Logic ---
          const baseNodesRaw = [
            { id: 'CENTRAL_HUB', group: 0, isCentral: true, fx: 0, fy: 0 },
            { id: 'ARQUITECTURA', group: 1, isNavLink: true, isCategoryNode: true, targetCategory: 'architecture' },
            { id: 'DISEÑO', group: 2, isNavLink: true, isCategoryNode: true, targetCategory: 'design' },
            { id: 'ESCENOGRAFÍAS', group: 2, isNavLink: true, isCategoryNode: true, targetCategory: 'scenography' },
            { id: 'CONTACTO', group: 2, isNavLink: true, isPage: true, targetPage: 'contact' }
          ];

          const archNodes = [...new Set(allProjectsData.filter(p => p.category === 'architecture' && p.subcategory).map(p => p.subcategory))].map(sub => ({ id: sub, group: 2, isNavLink: true, isSubcategory: true, targetCategory: 'architecture', targetSubcategory: sub }));
          
          const designSubcategories = [...new Set(allProjectsData.filter(p => p.category === 'design' && p.subcategory).map(p => p.subcategory))];
          const designNodes = designSubcategories.map(sub => ({ id: sub, group: 2, isNavLink: true, isSubcategory: true, targetCategory: 'design', targetSubcategory: sub }));
          
          baseNodesRaw.push(...archNodes, ...designNodes);

          const baseLinksRaw = [
            { source: 'CENTRAL_HUB', target: 'ARQUITECTURA', value: 1 }, 
            { source: 'CENTRAL_HUB', target: 'DISEÑO', value: 1 }, 
            { source: 'CENTRAL_HUB', target: 'ESCENOGRAFÍAS', value: 1 }, 
            { source: 'CENTRAL_HUB', target: 'CONTACTO', value: 1 },
            ...archNodes.map(n => ({ source: 'ARQUITECTURA', target: n.id, value: 2 })),
            ...designNodes.map(n => ({ source: 'DISEÑO', target: n.id, value: 2 }))
          ];

          const getSourceNode = (project) => {
            if (project.category === 'architecture') return project.subcategory || 'ARQUITECTURA';
            if (project.category === 'design') return project.subcategory || 'DISEÑO';
            if (project.category === 'scenography') return 'ESCENOGRAFÍAS';
            return 'CENTRAL_HUB';
          };

          let nodesData = [];
          let linksData = [];

          const relevantProjects = allProjectsData.filter(p => p.id !== 'cat-proyectos' && p.id !== 'cat-investigacion' && p.id !== 'escritos-arquitectura');

          if (filter === 'all') {
              nodesData = [...baseNodesRaw];
              linksData = [...baseLinksRaw];
              
              const projectNodes = relevantProjects.map(p => ({ 
                  id: p.title, group: 4, isNavLink: true, isProject: true, projectId: p.id, isPage: !!p.isPage,
                  targetPage: p.targetPage || p.id
              }));
              // For all projects, getSourceNode will return 'PROYECTOS', 'INVESTIGACIÓN', 'CONCEPT', 'LUMINARIAS', etc.
              const projectLinks = relevantProjects.map(p => ({ source: getSourceNode(p), target: p.title, value: 5 }));
              
              nodesData.push(...projectNodes);
              linksData.push(...projectLinks);
          } else {
              const categoryMap = { 'architecture': 'ARQUITECTURA', 'design': 'DISEÑO', 'scenography': 'ESCENOGRAFÍAS' };
              const categoryName = categoryMap[filter];
              if (categoryName) {
                  let localProjects = relevantProjects.filter(p => p.category === filter);
                  let localSubcategories = [];
                  
                  if (filter === 'architecture') {
                      localSubcategories = archNodes;
                      localProjects = []; // Do not display projects directly if filter is just architecture
                  } else if (filter === 'design') {
                      localSubcategories = designNodes;
                  }

                  const projectNodes = localProjects.map(p => ({ 
                      id: p.title, group: 4, isNavLink: true, isProject: true, projectId: p.id, isPage: !!p.isPage,
                      targetPage: p.targetPage || p.id
                  }));
                  
                  const projectLinks = localProjects.map(p => {
                     // Inside a category, link to subcategories if any, else link to category
                     const src = getSourceNode(p);
                     return { source: src, target: p.title, value: 5 };
                  });

                  nodesData = [
                      { id: 'CENTRAL_HUB', group: 0, isCentral: true, fx: 0, fy: 0 },
                      { id: categoryName, group: 1, isNavLink: true },
                      ...localSubcategories,
                      ...projectNodes
                  ];
                  linksData = [
                      { source: 'CENTRAL_HUB', target: categoryName, value: 1 },
                      ...localSubcategories.map(n => ({ source: categoryName, target: n.id, value: 2 })),
                      ...projectLinks
                  ];
              }
          }
          // --- End Data Filtering ---
          
          const visibleNodes = nodesData.filter(n => n.id !== 'CENTRAL_HUB');

          const svg = d3.select(svgRef.current)
            .attr('width', width)
            .attr('height', height)
            .attr('viewBox', [-width / 2, -height / 2, width, height]);

          svg.selectAll("*").remove(); 

          if (simulationRef.current) {
            simulationRef.current.stop();
          }

          const simulation = d3.forceSimulation(nodesData)
            .force('link', d3.forceLink(linksData).id(d => d.id).distance(d => {
              if (isMobile) return d.value === 1 ? 200 : (d.value === 5 ? 80 : 120);
              return d.value === 1 ? 300 : (d.value === 5 ? 120 : 180);
            }))
            .force('charge', d3.forceManyBody().strength(d => d.isCentral ? -1000 : (isMobile ? -200 : -400)))
            .force('center', d3.forceCenter(0, 0));
          
          simulationRef.current = simulation;
          simulation.alphaTarget(0.01); // Keep simulation active for continuous orbit

          svg.append('circle').attr('cx', 0).attr('cy', 0).attr('r', Math.min(width, height) / 2 - 40).attr('stroke', 'rgba(255, 255, 255, 0.1)').attr('stroke-width', 1).attr('fill', 'none');

          const link1 = svg.append('g').attr('stroke', '#666').attr('stroke-opacity', 0).selectAll('line').data(linksData).join('line').attr('class', 'animated-link').attr('stroke-width', d => d.value === 5 ? 0.5 : Math.sqrt(d.value));
          link1.transition().duration(1000).delay(500).attr('stroke-opacity', 0.6);

          const node1 = svg.append('g').selectAll('g').data(visibleNodes).join('g')
            .style('cursor', d => d.isNavLink ? 'pointer' : 'default')
            .on('click', (event, d) => {
                if (!d.isNavLink) return;
                event.preventDefault();
                event.stopPropagation();
                onNodeClick(d);
            })
            .call(d3.drag()
                .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
                .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0.01); d.fx = null; d.fy = null; }));

          const getNodeColor = (d) => d.isNavLink && !d.isProject ? '#fff' : (d.isProject ? '#aaa' : '#777');

          node1.on('mouseover', function(event, d) {
            if (d.isNavLink) {
              d3.select(this).select('text').transition().duration(200).attr('fill', '#00ffff');
              d3.select(this).select('circle').transition().duration(200).attr('fill', '#00ffff').attr('r', d.isNavLink && !d.isProject ? 10 : (d.isProject ? 7 : 8));
            }
          }).on('mouseout', function(event, d) {
            if (d.isNavLink) {
              d3.select(this).select('text').transition().duration(200).attr('fill', d.isProject ? '#aaa' : '#fff');
              d3.select(this).select('circle').transition().duration(200).attr('fill', getNodeColor(d)).attr('r', d.isNavLink && !d.isProject ? 8 : (d.isProject ? 5 : 6));
            }
          });

          node1.append('circle').attr('r', d => d.isNavLink && !d.isProject ? 8 : (d.isProject ? 5 : 6)).attr('fill', getNodeColor).attr('stroke', '#000').attr('stroke-width', 2);
          
          node1.append('text').text(d => d.id)
            .attr('x', 12)
            .attr('y', 4)
            .attr('fill', d => d.isProject ? '#aaa' : '#fff')
            .style('font-size', isMobile ? '0.8rem' : '0.9rem')
            .style('text-transform', 'uppercase')
            .style('letter-spacing', '0.05em')
            .style('font-weight', d => d.isProject ? 'normal' : 'bold')
            .style('opacity', d => d.isProject ? 0.7 : 1);

          simulation.on('tick', () => {
            const margin = isMobile ? 10 : 20;
            const leftBound = -width / 2 + margin;
            const rightBound = width / 2 - margin;
            const topBound = -height / 2 + margin;
            const bottomBound = height / 2 - margin;
            
            node1.each(d => {
                d.x = Math.max(leftBound, Math.min(rightBound, d.x));
                d.y = Math.max(topBound, Math.min(bottomBound, d.y));
            });

            link1.attr('x1', d => d.source.x || 0).attr('y1', d => d.source.y || 0).attr('x2', d => d.target.x || 0).attr('y2', d => d.target.y || 0);
            node1.attr('transform', d => `translate(${d.x || 0}, ${d.y || 0})`);
          });

          return () => simulation.stop();
        }, [filter, disruptSignal, onNodeClick]);

        return (
            <div className="w-full h-full relative">
                <svg ref={svgRef} className="w-full h-full bg-transparent relative z-10" />
            </div>
        );
      };

            const height = window.innerHeight;

            const baseNodes = [
                { id: title, isSun: true, fx: 0, fy: 0 }
            ];

            const subcategories = subcategory ? [] : [...new Set(projects.map(p => p.subcategory).filter(Boolean))];
            const subcategoryNodes = subcategories.map(sub => ({ id: sub, isSubSun: true, sun: title }));

            const projectNodes = projects.map(p => ({ 
                id: p.title, 
                isProject: true, 
                isPage: !!p.isPage || !!p.isCategoryNode, 
                isCategoryNode: !!p.isCategoryNode,
                projectId: p.id, 
                sun: subcategory ? title : (p.subcategory || title) 
            }));
            
            projectNodes.forEach(node => {
                node.x = 0;
                node.y = 0;
            });
            subcategoryNodes.forEach(node => {
                node.x = 0;
                node.y = 0;
            });
            
            const nodesData = [...baseNodes, ...subcategoryNodes, ...projectNodes];
            const linksData = [
                ...subcategoryNodes.map(sub => ({ source: title, target: sub.id })),
                ...projectNodes.map(p => ({ source: p.sun, target: p.id }))
            ];

            const svg = d3.select(svgRef.current)
                .attr('width', width)
                .attr('height', height)
                .attr('viewBox', [-width / 2, -height / 2, width, height]);
            svg.selectAll("*").remove(); 

          const simulation = d3.forceSimulation(nodesData)
            .force('link', d3.forceLink(linksData).id(d => d.id).distance(d => {
                    if (d.target.isSubSun || d.target.isPage || d.target.isCategoryNode) return isMobile ? 150 : 280;
                    return isMobile ? 80 : 160;
                }).strength(0.5))
                .force('charge', d3.forceManyBody().strength(d => {
                    if (d.isSun) return isMobile ? -2500 : -3500;
                    if (d.isSubSun || d.isPage || d.isCategoryNode) return isMobile ? -1000 : -1500;
                    return isMobile ? -300 : -300;
                }))
                .force('center', d3.forceCenter(0, 0))
                .force('collide', d3.forceCollide().radius(d => {
                    if (d.isSun) return 70;
                    if (d.isSubSun || d.isPage) return 40;
                    return 25;
                }));

            const link = svg.append('g').attr('stroke', '#aaa').attr('stroke-opacity', 0).selectAll('line').data(linksData).join('line').attr('class', 'animated-link')
                .attr('stroke-width', d => d.target.isSubSun ? 2 : 1);
            link.transition().duration(1000).delay(800).attr('stroke-opacity', d => d.target.isSubSun ? 0.9 : 0.5);

            const node = svg.append('g').selectAll('g').data(nodesData).join('g')
                .style('cursor', d => (d.isProject || d.isSubSun) ? 'pointer' : 'default')
                .on('click', (event, d) => {
                    if (d.isProject) {
                      if (d.isPage) {
                        onProjectSelect(d.projectId, true);
                      } else {
                        onProjectSelect(d.projectId, false);
                      }
                    } else if (d.isSubSun && onSubcategorySelect) {
                        onSubcategorySelect(d.id);
                    }
                });

            const sunNodes = node.filter(d => d.isSun);
            if (!showEye) {
                sunNodes.classed('sun-node', true).append('text').text(d => d.id)
                    .attr('text-anchor', 'middle')
                    .attr('y', 5)
                    .attr('fill', '#fff')
                    .style('font-size', isMobile ? '1.8rem' : '2.5rem')
                    .style('font-family', "'Cormorant Garamond', serif")
                    .style('text-transform', 'uppercase')
                    .style('letter-spacing', '0.1em');
            }

            const subSunNodes = node.filter(d => d.isSubSun);
            subSunNodes.append('circle').attr('r', isMobile ? 15 : 20).attr('fill', 'none').attr('stroke', '#fff').attr('stroke-width', 2).attr('stroke-dasharray', '4 4');
            subSunNodes.append('text').text(d => d.id)
                .attr('text-anchor', 'middle')
                .attr('y', isMobile ? 25 : 35)
                .attr('fill', '#fff')
                .style('font-size', isMobile ? '0.7rem' : '0.9rem')
                .style('text-transform', 'uppercase')
                .style('letter-spacing', '0.1em')
                .style('font-weight', 'bold');

            const pageProjectGroups = node.filter(d => d.isProject && d.isPage);
            pageProjectGroups.append('circle').attr('r', isMobile ? 15 : 20).attr('fill', 'none').attr('stroke', '#fff').attr('stroke-width', 2).attr('stroke-dasharray', '4 4');
            pageProjectGroups.append('text').text(d => d.id)
                .attr('text-anchor', 'middle')
                .attr('y', isMobile ? 25 : 35)
                .attr('fill', '#fff')
                .style('font-size', isMobile ? '0.7rem' : '0.9rem')
                .style('text-transform', 'uppercase')
                .style('letter-spacing', '0.1em')
                .style('font-weight', 'bold');
            
            pageProjectGroups.on('mouseover', function() {
                d3.select(this).select('text').transition().duration(200).attr('fill', '#00ffff');
                d3.select(this).select('circle').transition().duration(200).attr('stroke', '#00ffff');
            }).on('mouseout', function() {
                d3.select(this).select('text').transition().duration(200).attr('fill', '#fff');
                d3.select(this).select('circle').transition().duration(200).attr('stroke', '#fff');
            });

            const projectNodeGroups = node.filter(d => d.isProject && !d.isPage);
            projectNodeGroups.append('circle').attr('r', isMobile ? 5 : 3).attr('fill', '#999').attr('stroke', '#fff').attr('stroke-width', 1.5);
            
            const projectTexts = projectNodeGroups.append('text').text(d => d.id)
                .attr('y', 4)
                .attr('fill', '#aaa')
                .style('font-size', isMobile ? '0.9rem' : '0.8rem')
                .style('text-transform', 'uppercase');
            
            projectNodeGroups.on('mouseover', function(event, d) {
                d3.select(this).select('text').transition().duration(200).attr('fill', '#00ffff');
                d3.select(this).select('circle').transition().duration(200).attr('fill', '#00ffff').attr('r', isMobile ? 7 : 5);
                const project = allProjectsData.find(p => p.id === d.projectId);
                if (project) {
                    onProjectHoverRef.current(project);
                    if (!project.isPage) {
                        const content = project.summary || (project.description && (project.description.length > 150 ? project.description.substring(0, 150) + '...' : project.description));
                        if (content) {
                            setTooltip({ visible: true, content: content, x: event.pageX, y: event.pageY });
                        }
                    }
                }
            }).on('mousemove', function(event, d) {
                setTooltip(prev => ({ ...prev, x: event.pageX, y: event.pageY }));
            }).on('mouseout', function() {
                d3.select(this).select('text').transition().duration(200).attr('fill', '#aaa');
                d3.select(this).select('circle').transition().duration(200).attr('fill', '#999').attr('r', isMobile ? 5 : 3);
                setTooltip({ visible: false, content: '', x: 0, y: 0 });
                onProjectHoverRef.current(null);
            });

            node.call(d3.drag()
                .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
                .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); if (!d.isSun) { d.fx = null; d.fy = null; } }));

            node.style('opacity', 0)
                .transition()
                .duration(1200)
                .delay((d, i) => d.isSun ? 0 : 500 + i * 50)
                .style('opacity', 1);

            simulation.on('tick', () => {
                const margin = isMobile ? 10 : 20;
                const textOffset = 12;

                node.each(d => {
                    const leftBound = -width / 2 + margin;
                    const rightBound = width / 2 - margin;
                    const topBound = -height / 2 + margin;
                    const bottomBound = height / 2 - margin;

                    d.x = Math.max(leftBound, Math.min(rightBound, d.x));
                    d.y = Math.max(topBound, Math.min(bottomBound, d.y));
                });
                link.attr('x1', d => d.source.x || 0).attr('y1', d => d.source.y || 0).attr('x2', d => d.target.x || 0).attr('y2', d => d.target.y || 0);
                node.attr('transform', d => `translate(${d.x || 0}, ${d.y || 0})`);

                projectTexts
                  .attr('x', d => (d.x || 0) >= 0 ? -textOffset : textOffset)
                  .attr('text-anchor', d => (d.x || 0) >= 0 ? 'end' : 'start');
            });
            return simulation;
        }, [showEye]);

        React.useEffect(() => {
          const simulation = simulationCallback(category, subcategory, title, onProjectSelect, onSubcategorySelect);
          return () => simulation.stop();
        }, [category, subcategory, title, onProjectSelect, onSubcategorySelect, simulationCallback]);

                <footer className="absolute bottom-4 left-1/2 -translate-x-1/2 text-xs text-gray-500 z-10">© 2024 Benito González Quiñones</footer>
            </div>
